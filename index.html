<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ARENA — Who Beats Who</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;width:100%;overflow-x:hidden}
body{background:#eef5ff;font-family:Arial,sans-serif;color:#172033;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

#startupScreen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#eef5ff}
.startup-box{width:min(650px,100%);height:100vh;display:flex;align-items:center;justify-content:center;background:#fff}
.startup-logo,.logo{color:#2563eb;font-weight:900;text-align:center}
.startup-logo{font-size:27px}
.startup-logo small,.logo small{display:block;color:#64748b;letter-spacing:2px;font-size:9px}
.startup-loader{width:28px;height:28px;margin:18px auto;border:3px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#startupScreen.hide{opacity:0;visibility:hidden;pointer-events:none;transition:.2s}

.app{max-width:650px;margin:auto;min-height:100vh;background:#fff;padding-bottom:calc(100px + env(safe-area-inset-bottom));box-shadow:0 0 25px #1e40af1a}

header{position:sticky;top:0;z-index:20;height:calc(62px + env(safe-area-inset-bottom));background:#fff;border-bottom:1px solid #dbe4f0;padding:calc(8px + env(safe-area-inset-bottom)) 12px 8px}
.top-row{height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.logo{font-size:21px}
.language{position:absolute;right:2px;border:1px solid #cbd5e1;background:#f8fafc;border-radius:8px;padding:5px 6px;font-size:10px}

.auth{min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#dbeafe,#eff6ff,#fff)}
.auth-box{width:min(430px,100%);background:#fff;padding:25px;border-radius:22px;box-shadow:0 10px 35px #2563eb26;border:1px solid #dbeafe}
.auth-box h1{text-align:center;color:#2563eb;margin-bottom:6px}
.auth-subtitle{text-align:center;color:#64748b;font-size:13px;margin-bottom:18px}
.auth-box input,.search-box input,.modal-box input,.modal-box textarea,.modal-box select{width:100%;padding:13px;margin:6px 0;border:1px solid #cbd5e1;border-radius:11px;outline:0}
.auth-box input:focus,.search-box input:focus,.modal-box input:focus,.modal-box textarea:focus{border-color:#2563eb}
.auth-box button:not(.password-toggle),.primary{width:100%;padding:13px;margin-top:8px;border:0;border-radius:11px;background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;font-weight:bold}
.auth-switch{text-align:center;margin-top:13px;color:#2563eb;cursor:pointer}
.password-box{position:relative}
.password-box input{padding-right:55px!important}
.password-toggle{position:absolute!important;right:5px;top:5px;width:45px!important;height:42px;padding:5px!important;margin:0!important;background:transparent!important;color:#2563eb!important;border:0}
.status{text-align:center;padding:12px;color:#2563eb}

.screen{display:none}
.screen.active{display:block}

.arena-top{text-align:center;padding:20px 15px 10px}
.arena-title{font-size:30px;font-weight:900}
.arena-subtitle{margin-top:6px;color:#64748b;font-size:14px}

.categories{display:flex;gap:7px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
.category-btn,.top-tab{flex-shrink:0;border:1px solid #dbe4f0;background:#f8fafc;color:#475569;padding:8px 13px;border-radius:20px;font-size:12px;font-weight:bold}
.category-btn.active,.top-tab.active{background:#2563eb;border-color:#2563eb;color:#fff}

.create-duel{margin:14px;border-radius:17px;background:linear-gradient(135deg,#eff6ff,#f8fafc);border:1px solid #bfdbfe;padding:15px}
.create-duel button{width:100%;border:0;background:0;color:#2563eb;font-weight:bold;padding:8px;font-size:15px}

.duel{margin:10px 12px 18px;border:1px solid #dbe4f0;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 5px 18px #0f172a12}
.duel-head{padding:13px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.duel-category{background:#eff6ff;color:#2563eb;padding:6px 9px;border-radius:10px;font-size:11px;font-weight:bold}
.duel-type{background:#172033;color:#fff;padding:6px 9px;border-radius:10px;font-size:11px;font-weight:bold}
.duel-time{color:#dc2626;font-size:12px;font-weight:bold;background:#fef2f2;padding:4px 8px;border-radius:8px;border:1px solid #fecaca}
.duel-time.ended{color:#64748b;background:#f1f5f9;border-color:#e2e8f0}
.duel-author-row{padding:0 14px 8px;font-size:12px;color:#64748b;font-weight:bold;display:flex;align-items:center;gap:6px}
.duel-title{padding:0 14px 13px;font-size:18px;font-weight:bold}

.duel-options{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 8px 8px}
.option{border:2px solid #e2e8f0;border-radius:15px;overflow:hidden;background:#f8fafc}
.option-media{position:relative;width:100%;height:220px;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.option-media img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.option-media video{width:100%;height:100%;object-fit:cover;background:#000}
.option-placeholder{font-size:38px;color:#64748b}
.video-placeholder{font-size:46px}
.option-label{padding:10px 7px;text-align:center;font-weight:bold;font-size:14px;word-break:break-word}
.vote-button{width:calc(100% - 16px);margin:0 8px 8px;border:0;border-radius:12px;padding:12px;background:#2563eb;color:#fff;font-weight:bold;font-size:16px}
.vote-button:disabled{opacity:.55;cursor:not-allowed}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:43px;height:43px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#172033;color:#fff;font-size:13px;font-weight:900;box-shadow:0 4px 15px #0003}

.results{padding:10px 12px 14px;border-top:1px solid #e2e8f0}
.result-row{margin:7px 0}
.result-info{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:4px}
.progress{height:9px;background:#e2e8f0;border-radius:20px;overflow:hidden}
.progress-fill{height:100%;min-width:0;background:linear-gradient(90deg,#2563eb,#60a5fa);border-radius:20px}

.duel-actions{display:flex;align-items:center;gap:8px;padding:8px 13px 12px;color:#64748b;font-size:12px;flex-wrap:wrap}
.duel-actions button{border:0;background:0;color:#64748b}
.owner-delete{color:#dc2626!important;font-weight:bold}
.admin-delete{color:#991b1b!important;font-weight:bold}
.duel-share-button{border:0!important;background:#f1f5f9!important;color:#2563eb!important;padding:7px 10px!important;border-radius:9px!important;font-weight:bold;display:flex;align-items:center;gap:5px}
.duel-total-votes{cursor:pointer;font-weight:bold;color:#2563eb}

.section-title{padding:20px 15px 8px;font-size:23px;font-weight:900}
.top-tabs{display:flex;gap:7px;padding:8px 14px}
.top-tab{flex:1;border-radius:10px;padding:9px;text-align:center}

.rank-item,.search-result{margin:8px 14px;padding:13px;border:1px solid #dbe4f0;border-radius:15px;display:flex;align-items:center;gap:12px}
.rank-number{width:34px;height:34px;border-radius:50%;background:#eff6ff;color:#2563eb;display:flex;align-items:center;justify-content:center;font-weight:bold}
.rank-main,.search-result-main{flex:1;min-width:0}
.rank-title{font-weight:bold}
.rank-category{color:#64748b;font-size:11px;margin-top:3px}
.rank-score{font-weight:bold;color:#2563eb;text-align:right}
.search-result{cursor:pointer}

.profile{padding:15px}
.profile-head{text-align:center;padding:15px 5px 20px;border-bottom:1px solid #dbe4f0}
.profile-big-avatar{width:90px;height:90px;margin:auto;border-radius:50%;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:45px;overflow:hidden;border:3px solid #3b82f6}
.profile-big-avatar img{width:100%;height:100%;object-fit:cover}
.profile-name{font-size:22px;font-weight:bold;margin-top:10px}
.profile-username{color:#64748b;margin-top:3px}
.profile-bio{margin:8px 0;color:#475569;white-space:pre-wrap}
.profile-stats{display:flex;justify-content:center;gap:35px;margin:18px 0}
.stat{text-align:center}
.stat-number{display:block;font-size:19px;font-weight:bold;color:#2563eb}
.stat-label{font-size:12px;color:#64748b}
.profile-buttons{display:flex;gap:8px;flex-wrap:wrap}
.profile-buttons button{flex:1;min-width:120px;border:0;border-radius:10px;padding:11px;background:#eff6ff;color:#1d4ed8}
.follow-button{background:#2563eb!important;color:#fff!important}
.admin-button{width:100%!important;flex-basis:100%;background:#172033!important;color:#fff!important}

.admin-panel{margin-top:15px;padding:15px;border:1px solid #bfdbfe;border-radius:15px;background:#eff6ff}
.admin-user-row{display:flex;align-items:center;gap:8px;padding:10px;margin-bottom:8px;background:#fff;border-radius:10px;border:1px solid #dbe4f0}
.admin-user-main{flex:1}
.admin-user-name{font-weight:bold}
.admin-active{color:#16a34a}
.admin-blocked{color:#dc2626;font-weight:bold}
.admin-action{border:0;padding:8px 10px;border-radius:8px;font-weight:bold}
.admin-block-button{background:#fee2e2;color:#b91c1c}
.admin-unblock-button{background:#dcfce7;color:#166534}

nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(650px,calc(100% - 24px));height:68px;background:#fff;border:1px solid #dbe4f0;border-radius:20px;display:flex;align-items:center;justify-content:space-around;z-index:50;box-shadow:0 10px 25px #0f172a15}
nav button{position:relative;flex:1;height:100%;border:0;background:transparent;color:#64748b;font-size:16px}
nav button span{font-size:10px}
nav button.add{flex:0 0 55px;width:55px;height:55px;margin-top:-28px;border-radius:50%;background:#2563eb;color:#fff;font-size:30px;box-shadow:0 6px 18px #2563eb55}

.modal{display:none;position:fixed;inset:0;background:#0f172a99;z-index:100;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal-box{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.modal-box h2{margin-bottom:12px;color:#2563eb}
.modal-box textarea{resize:vertical;min-height:90px}
.photo-button{display:block;padding:13px;margin:6px 0;border:2px dashed #60a5fa;border-radius:12px;text-align:center;color:#2563eb;font-weight:bold;background:#eff6ff}
#duelImageA,#duelImageB,#duelVideoA,#duelVideoB,#avatarInput{display:none}
.image-preview{display:none;width:100%;height:170px;margin:7px 0;border-radius:12px;overflow:hidden;background:#e2e8f0}
.image-preview img,.image-preview video{width:100%;height:100%;object-fit:cover}
.secondary{width:100%;padding:12px;margin-top:8px;border:0;border-radius:12px;background:#f1f5f9;color:#334155}
.empty{text-align:center;padding:35px 15px;color:#64748b}
.media-help{font-size:11px;color:#64748b;margin:4px 2px 8px}
</style>
</head>

<body>

<div id="startupScreen">
<div class="startup-box">
<div>
<div class="startup-logo">⚔️ ARENA<small>WHO BEATS WHO?</small></div>
<div class="startup-loader"></div>
</div>
</div>
</div>

<div id="auth" class="auth">
<div class="auth-box">
<h1>⚔️ ARENA</h1>
<div id="authSubtitle" class="auth-subtitle"></div>

<div id="loginBox">
<input id="loginEmail" type="email" autocomplete="email">
<div class="password-box">
<input id="loginPassword" type="password" autocomplete="current-password">
<button type="button" class="password-toggle" onclick="togglePassword('loginPassword',this)">👁️</button>
</div>
<button id="loginButton" type="button" onclick="login()"></button>
<div id="registerSwitch" class="auth-switch" onclick="showRegister()"></div>
</div>

<div id="registerBox" class="hidden">
<input id="regName" autocomplete="name">
<input id="regEmail" type="email" autocomplete="email">
<div class="password-box">
<input id="regPassword" type="password" autocomplete="new-password">
<button type="button" class="password-toggle" onclick="togglePassword('regPassword',this)">👁️</button>
</div>
<button id="registerButton" type="button" onclick="register()"></button>
<div id="loginSwitch" class="auth-switch" onclick="showLogin()"></div>
</div>

<div id="authStatus" class="status"></div>
</div>
</div>

<div id="app" class="app hidden">

<header>
<div class="top-row">
<div class="logo">⚔️ ARENA<small>WHO BEATS WHO?</small></div>
<select id="languageSelect" class="language" onchange="changeLanguage(this.value)">
<option value="ru">🇷🇺 RU</option>
<option value="ro">🇷🇴 RO</option>
<option value="en">🇬🇧 EN</option>
</select>
</div>
</header>

<div id="homeScreen" class="screen active">
<div class="arena-top">
<div id="arenaTitle" class="arena-title"></div>
<div id="arenaSubtitle" class="arena-subtitle"></div>
</div>

<div class="categories">
<button class="category-btn active" data-category="all" onclick="selectCategory('all',this)"></button>
<button class="category-btn" data-category="Фильмы" onclick="selectCategory('Фильмы',this)"></button>
<button class="category-btn" data-category="Музыка" onclick="selectCategory('Музыка',this)"></button>
<button class="category-btn" data-category="Игры" onclick="selectCategory('Игры',this)"></button>
<button class="category-btn" data-category="Спорт" onclick="selectCategory('Спорт',this)"></button>
<button class="category-btn" data-category="Мемы" onclick="selectCategory('Мемы',this)"></button>
<button class="category-btn" data-category="Авто" onclick="selectCategory('Авто',this)"></button>
<button class="category-btn" data-category="Другое" onclick="selectCategory('Другое',this)"></button>
</div>

<div class="create-duel">
<button onclick="openDuelModal()" id="createDuelButton"></button>
</div>

<div id="duelsFeed">

</div>

<button class="top-tab" onclick="loadTop('Игры',this)">🎮</button>
<button class="top-tab" onclick="loadTop('Музыка',this)">🎵</button>

<div id="topList"></div>
</div>

<div id="searchScreen" class="screen">
<div class="search-box" style="padding:15px">

</div>
<div id="searchResults"></div>
</div>

<div id="profileScreen" class="screen">

<div id="profileAvatar" class="profile-big-avatar">⚔️</div>
<div id="profileName" class="profile-name"></div>
<div id="profileUsername" class="profile-username">@arena</div>

<div class="profile-stats">

<div class="profile-buttons">

<button id="logoutButton" type="button" onclick="logout()"></button>
<button id="adminButton" class="admin-button hidden" type="button" onclick="openAdminPanel()"></button>

<div id="adminContent"></div>
</div>
</div>

<h3 id="myDuelsTitle" style="margin:18px 0 10px"></h3>

</div>

<nav>

<div id="duelModal" class="modal">
<div class="modal-box">
<h2 id="duelModalTitle"></h2>
<input id="duelTitle">

<option value="Фильмы" data-opt="films"></option>
<option value="Музыка" data-opt="music"></option>
<option value="Игры" data-opt="games"></option>
<option value="Спорт" data-opt="sport"></option>

<input id="duelVideoOptionB">

<div id="duelStatus" class="status"></div>
</div>
</div>

</div>
</div>

const t=k=>T[language]?.[k]||T.ru[k]||k;

function esc(v){
const d=document.createElement("div");
d.textContent=v??"";
return d.innerHTML;
}

function escJS(v){
return String(v??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,'\\"');
}

function rnd(){
return Math.random().toString(36).slice(2);
}

function formatCountdown(expiresAt){
if(!expiresAt)return{text:t("unlimited"),ended:false};
const diff=new Date(expiresAt).getTime()-Date.now();
if(diff<=0)return{text:t("battleEnded"),ended:true};
const h=String(Math.floor(diff/(1000*60*60))).padStart(2,"0");
const m=String(Math.floor((diff%(1000*60*60))/(1000*60))).padStart(2,"0");
const s=String(Math.floor((diff%(1000*60))/1000)).padStart(2,"0");
return{text:`⏳ ${h}:${m}:${s}`,ended:false};
}

function startCountdownTimers(){
setInterval(()=>{
document.querySelectorAll(".duel-time[data-expires]").forEach(el=>{
const res=formatCountdown(el.dataset.expires);
el.innerText=res.text;
if(res.ended){
el.classList.add("ended");
el.closest(".duel")?.querySelectorAll(".vote-button").forEach(b=>b.disabled=true);
}
});
},1000);
}

try{
db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true}});

}catch(e){return false;}

async function register(){
const rawName=$("regName").value.trim();
const email=$("regEmail").value.trim().toLowerCase();
const pass=$("regPassword").value;
const status=$("authStatus");
if(!rawName||!email||!pass){status.innerText=t("invalid");return;}
if(pass.length<6){status.innerText=t("passwordLength");return;}
$("registerButton").disabled=true;
status.innerText=t("creatingAccount");
try{
const r=await db.auth.signUp({email,password:pass,options:{data:{full_name:rawName,username:"arena_"+rnd()}}});
if(r.error)throw r.error;
if(r.data.user){
await db.from("profiles").upsert({id:r.data.user.id,full_name:rawName,username:"arena_"+rnd()},{onConflict:"id"});
}
status.innerText=t("checkingEmail");
setTimeout(()=>location.reload(), 1500);
}catch(e){status.innerText=e.message;}
$("registerButton").disabled=false;
}

async function login(){
const email=$("loginEmail").value.trim().toLowerCase();
const pass=$("loginPassword").value;
const status=$("authStatus");
if(!email||!pass){status.innerText=t("enterCredentials");return;}
$("loginButton").disabled=true;
status.innerText=t("loggingIn");
try{
const r=await db.auth.signInWithPassword({email,password:pass});
if(r.error)throw r.error;
location.reload();
}catch(e){
status.innerText=e.message;
$("loginButton").disabled=false;
}
}

async function logout(){
try{await db.auth.signOut();}catch(e){}
localStorage.clear();
location.reload();
}

async function count(table,column,id){
const r=await db.from(table).select("*",{count:"exact",head:true}).eq(column,id);
return r.count||0;
}

async function getVote(id){
if(!currentUser)return null;
const r=await db.from("duel_votes").select("choice").eq("duel_id",id).eq("user_id",currentUser.id).maybeSingle();
return r.data?.choice||null;
}

async function getDuelVoteCounts(id){
const r=await db.from("duel_votes").select("choice").eq("duel_id",id);
let a=0,b=0;
(r.data||[]).forEach(row=>{if(row.choice==="a")a++;if(row.choice==="b")b++;});
const total=a+b;
return{a,b,total,pa:total?Math.round((a/total)*100):0,pb:total?100-Math.round((a/total)*100):0};
}

async function duelCard(duel){
const vote=await getVote(duel.id);
const counts=await getDuelVoteCounts(duel.id);
const id=String(duel.id);
const video=!!(duel.video_a||duel.video_b);
const owner=String(duel.user_id)===String(currentUser?.id);
const admin=currentProfile?.is_admin===true;

let authorName=t("participant");
try{
const ar=await db.from("profiles").select("full_name").eq("id",duel.user_id).maybeSingle();
if(ar.data?.full_name)authorName=ar.data.full_name;
}catch(e){}

const mediaA=video?(duel.video_a?`<video src="${esc(duel.video_a)}" controls playsinline></video>`:`<div class="option-placeholder video-placeholder">🎥</div>`):(duel.image_a?`<img src="${esc(duel.image_a)}">`:`<div class="option-placeholder">A</div>`);
const mediaB=video?(duel.video_b?`<video src="${esc(duel.video_b)}" controls playsinline></video>`:`<div class="option-placeholder video-placeholder">🎥</div>`):(duel.image_b?`<img src="${esc(duel.image_b)}">`:`<div class="option-placeholder">B</div>`);

const timer=formatCountdown(duel.expires_at);
const card=document.createElement("article");
card.className="duel";
card.dataset.duelId=id;

card.innerHTML=`
<div class="duel-head">
<span class="duel-category">${esc(duel.category)}</span>
<span class="duel-time ${timer.ended?'ended':''}" data-expires="${esc(duel.expires_at||'')}">${timer.text}</span>
</div>
<div class="duel-author-row">👤 ${esc(authorName)}</div>
<div class="duel-title">${esc(duel.title)}</div>
<div class="duel-options">
<div class="option">
<div class="option-media">${mediaA}</div>
<div class="option-label">${esc(duel.option_a||duel.video_option_a||"A")}</div>
<button class="vote-button" type="button" ${(vote||timer.ended)?"disabled":""} onclick="voteDuel('${id}','a',this)">${vote?(vote==="a"?t("yourChoice"):"❤️"):t("chooseA")}</button>
</div>
<div class="option">
<div class="option-media">${mediaB}</div>
<div class="option-label">${esc(duel.option_b||duel.video_option_b||"B")}</div>
<button class="vote-button" type="button" ${(vote||timer.ended)?"disabled":""} onclick="voteDuel('${id}','b',this)">${vote?(vote==="b"?t("yourChoice"):"❤️"):t("chooseB")}</button>
</div>
<div class="vs">VS</div>
</div>
<div class="results">
<div class="result-row">
<div class="result-info"><span>A · ${counts.a}</span><b>${counts.pa}%</b></div>
<div class="progress"><div class="progress-fill" style="width:${counts.pa}%"></div></div>
</div>
<div class="result-row">
<div class="result-info"><span>B · ${counts.b}</span><b>${counts.pb}%</b></div>
<div class="progress"><div class="progress-fill" style="width:${counts.pb}%"></div></div>
</div>
</div>
<div class="duel-actions">
<span class="duel-total-votes">🗳️ ${counts.total} ${t("votes")}</span>
${owner?`<button class="owner-delete" type="button" onclick="deleteDuel('${id}')">${t("delete")}</button>`:""}
${admin?`<button class="admin-delete" type="button" onclick="deleteDuel('${id}',true)">${t("adminDelete")}</button>`:""}
</div>
<div style="border-top:1px solid #e2e8f0;padding:12px 14px;background:#f8fafc">
<div id="comments-${id}" style="margin-bottom:10px;max-height:180px;overflow-y:auto"><div style="font-size:12px;color:#64748b;text-align:center">${t("loading")}</div></div>
<div style="display:flex;gap:6px">
<input type="text" id="comment-input-${id}" placeholder="${t("commentPlaceholder")}" style="flex:1;padding:9px 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:13px;outline:0;background:#fff" onkeydown="if(event.key==='Enter')addComment('${id}')">
<button type="button" onclick="addComment('${id}')" style="padding:9px 14px;border:0;background:#2563eb;color:#fff;border-radius:10px;font-weight:bold;font-size:13px">${t("send")}</button>
</div>
</div>
`;

setTimeout(()=>loadComments(id),0);
return card;
}

async function loadComments(duelId){
const container=$(`comments-${duelId}`);
if(!container)return;
try{
const r=await db.from("duel_comments").select("*").eq("duel_id",duelId).order("created_at",{ascending:true});
const comments=r.data||[];
if(!comments.length){container.innerHTML=`<div style="font-size:12px;color:#64748b;text-align:center;padding:6px">${t("noComments")}</div>`;return;}

const userIds=[...new Set(comments.map(c=>c.user_id))];
const pr=await db.from("profiles").select("id,full_name,avatar_url").in("id",userIds);
const pMap={};
(pr.data||[]).forEach(p=>pMap[p.id]=p);

container.innerHTML=comments.map(c=>{
const p=pMap[c.user_id]||{};
const name=p.full_name||t("participant");
const avatar=p.avatar_url?`<img src="${esc(p.avatar_url)}" style="width:26px;height:26px;border-radius:50%;object-fit:cover">`:`<div style="width:26px;height:26px;border-radius:50%;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:11px">⚔️</div>`;
const canDelete=currentUser&&(c.user_id===currentUser.id||currentProfile?.is_admin===true);
return `<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;font-size:12px">${avatar}<div style="flex:1;background:#fff;padding:8px 10px;border-radius:10px;border:1px solid #e2e8f0"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px"><span style="font-weight:bold">${esc(name)}</span>${canDelete?`<button onclick="deleteComment('${c.id}')" style="border:0;background:0;color:#dc2626;cursor:pointer">✕</button>`:""}</div><div>${esc(c.text)}</div></div></div>`;
}).join("");
}catch(e){container.innerHTML=`<div style="font-size:12px;color:#dc2626;text-align:center">Ошибка чата</div>`;}
}

async function addComment(duelId){
const input=$(`comment-input-${duelId}`);
if(!input)return;
const text=input.value.trim();
if(!text)return;
try{
const r=await db.from("duel_comments").insert({duel_id:duelId,user_id:currentUser.id,text});
if(r.error)throw r.error;
location.reload(); // Перезагрузка для обновления чата
}catch(e){alert(e.message);}
}

async function deleteComment(id){
try{
const r=await db.from("duel_comments").delete().eq("id",id);
if(r.error)throw r.error;
location.reload();
}catch(e){alert(e.message);}
}

async function loadDuels(){
const box=$("duelsFeed");
box.innerHTML=`<div class="status">${esc(t("loading"))} ⏳</div>`;
let q=db.from("duels").select("*").order("created_at",{ascending:false}).limit(50);
if(currentCategory!=="all")q=q.eq("category",currentCategory);
const r=await q;
box.innerHTML="";
if(!r.data?.length){box.innerHTML=`<div class="empty">${esc(t("noDuels"))}</div>`;return;}
for(const duel of r.data){
box.appendChild(await duelCard(duel));
}
}

document.querySelectorAll(".category-btn").forEach(e=>e.classList.remove("active"));
btn.classList.add("active");
loadDuels();
}

async function voteDuel(id,choice,btn){
if(!currentUser)return;
btn.closest(".duel")?.querySelectorAll(".vote-button").forEach(b=>b.disabled=true);
try{
const r=await db.from("duel_votes").insert({duel_id:id,user_id:currentUser.id,choice});
if(r.error)throw r.error;
location.reload(); // Перезагрузка страницы после голоса
}catch(e){alert(e.message);location.reload();}
}

async function deleteDuel(id,admin=false){
showCustomConfirm(t(admin?"adminDeleteConfirm":"deleteConfirm"),async()=>{
let q=db.from("duels").delete().eq("id",id);
if(!admin)q=q.eq("user_id",currentUser.id);
await q;
location.reload();
},t("delete"));
}

function showCustomConfirm(msg,onOk,okText="OK"){
$("customConfirmText").innerText=msg;
$("customConfirmOk").innerText=okText;
$("customConfirmCancel").innerText=t("cancel");
const modal=$("customConfirmModal");
modal.classList.add("show");
$("customConfirmOk").onclick=()=>{modal.classList.remove("show");onOk();};
$("customConfirmCancel").onclick=()=>modal.classList.remove("show");
}

function toggleDuelType(){
const type=$("duelType").value;
$("photoFields").classList.toggle("hidden",type!=="photo");
$("videoFields").classList.toggle("hidden",type!=="video");
}

function openDuelModal(){
if(!currentUser){showAuth();return;}
$("duelModal").classList.add("show");
}

function closeModal(id){$(id).classList.remove("show");}

function previewDuelMedia(side,e,type){
const file=e.target.files?.[0];
if(!file)return;
const reader=new FileReader();
reader.onload=ev=>{
if(type==="image"){
if(side==="A"){selectedImageA=file;$("previewAImage").src=ev.target.result;$("previewA").style.display="block";}
else{selectedImageB=file;$("previewBImage").src=ev.target.result;$("previewB").style.display="block";}
}else{
if(side==="A"){selectedVideoA=file;$("previewVideoAElement").src=ev.target.result;$("previewVideoA").style.display="block";}
else{selectedVideoB=file;$("previewVideoBElement").src=ev.target.result;$("previewVideoB").style.display="block";}
}
};
reader.readAsDataURL(file);
}

async function upload(file,folder){
if(!file)return"";
const path=`${folder}/${currentUser.id}-${Date.now()}-${rnd()}.${file.name.split(".").pop()||"bin"}`;
const r=await db.storage.from("Photos").upload(path,file,{upsert:true});
if(r.error)throw r.error;
return db.storage.from("Photos").getPublicUrl(path).data.publicUrl;
}

async function createDuel(){
const title=$("duelTitle").value.trim();
const type=$("duelType").value;
const category=$("duelCategory").value;
const duration=parseInt($("duelDuration").value,10);
const optionA=type==="video"?$("duelVideoOptionA").value.trim():$("duelOptionA").value.trim();
const optionB=type==="video"?$("duelVideoOptionB").value.trim():$("duelOptionB").value.trim();

if(!title||!optionA||!optionB){$("duelStatus").innerText=t("invalid");return;}
$("duelSubmitButton").disabled=true;
$("duelStatus").innerText=t("uploading");

try{
const imageA=type==="photo"&&selectedImageA?await upload(selectedImageA,"duels"):"";
const imageB=type==="photo"&&selectedImageB?await upload(selectedImageB,"duels"):"";
const videoA=type==="video"&&selectedVideoA?await upload(selectedVideoA,"videos"):"";
const videoB=type==="video"&&selectedVideoB?await upload(selectedVideoB,"videos"):"";

const expiresAt=duration>0?new Date(Date.now()+duration*3600*1000).toISOString():null;
await db.from("duels").insert({
user_id:currentUser.id,title,category,duration_hours:duration,expires_at:expiresAt,
option_a:type==="photo"?optionA:"",option_b:type==="photo"?optionB:"",
image_a:imageA,image_b:imageB,
video_option_a:type==="video"?optionA:"",video_option_b:type==="video"?optionB:"",
video_a:videoA,video_b:videoB
});
location.reload(); // Перезагрузка после создания дуэли
}catch(e){
$("duelStatus").innerText=e.message;
$("duelSubmitButton").disabled=false;
}
}

async function loadTop(cat="all",btn){
showScreen("topScreen");
if(btn){document.querySelectorAll(".top-tab").forEach(e=>e.classList.remove("active"));btn.classList.add("active");}
const box=$("topList");
box.innerHTML=`<div class="status">${esc(t("loading"))}</div>`;
let q=db.from("duels").select("*").limit(50);
if(cat!=="all")q=q.eq("category",cat);
const r=await q;
const scored=[];
for(const d of r.data||[]){
const counts=await getDuelVoteCounts(d.id);
scored.push({duel:d,counts});
}
scored.sort((x,y)=>y.counts.total-x.counts.total);
box.innerHTML=scored.length?scored.map((item,i)=>`
<div class="rank-item">
<div class="rank-number">${i+1}</div>
<div class="rank-main"><div class="rank-title">${esc(item.duel.title)}</div><div class="rank-category">${esc(item.duel.category)}</div></div>
<div class="rank-score">${item.counts.total}<br><small>${t("votes")}</small></div>
</div>
`).join(""):`<div class="empty">${esc(t("noDuels"))}</div>`;
}

async function loadMyDuels(){
const box=$("myDuels");
const r=await db.from("duels").select("*").eq("user_id",currentUser.id).order("created_at",{ascending:false});
box.innerHTML="";
if(!r.data?.length){box.innerHTML=`<div class="empty">${esc(t("noMyDuels"))}</div>`;return;}
for(const duel of r.data)box.appendChild(await duelCard(duel));
}

async function openAdminPanel(){
if(currentProfile?.is_admin!==true)return;
$("adminPanel").classList.toggle("hidden");
if(!$("adminPanel").classList.contains("hidden")){
const r=await db.from("profiles").select("id,full_name,username,is_admin,is_blocked").limit(100);
$("adminContent").innerHTML=(r.data||[]).map(u=>`
<div class="admin-user-row">
<div class="admin-user-main"><b>${esc(u.full_name)}</b><div style="font-size:11px;color:#64748b">@${esc(u.username)}</div></div>
${u.id!==currentUser.id?`<button class="admin-action ${u.is_blocked?"admin-unblock-button":"admin-block-button"}" onclick="adminBlock('${u.id}',${!!u.is_blocked})">${u.is_blocked?t("unblock"):t("block")}</button>`:""}
</div>
`).join("");
}
}

async function adminBlock(id,blocked){
showCustomConfirm("Изменить статус блокировки?",async()=>{
await db.rpc("admin_set_blocked",{target_user_id:id,blocked_value:!blocked});
location.reload();
},"OK");
}

document.addEventListener("DOMContentLoaded",async()=>{
if(!["ru","ro","en"].includes(language))language="ru";
applyLanguage();
startCountdownTimers();
if(!initDB()){hideStartup();showAuth();showLogin();return;}

const s=await db.auth.getSession();
if(s.data?.session){
currentUser=s.data.session.user;
try{await loadProfile();}catch(e){}
showScreen("homeScreen");
await loadDuels();
}else{
showAuth();
showLogin();
}
hideStartup();
});
</script>
