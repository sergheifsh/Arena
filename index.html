<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ARENA — Who Beats Who</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;width:100%;overflow-x:hidden}
body{background:#eef5ff;font-family:Arial,sans-serif;color:#172033;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

#startupScreen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#eef5ff}
.startup-box{width:min(650px,100%);height:100vh;display:flex;align-items:center;justify-content:center;background:#fff}
.startup-logo,.logo{color:#2563eb;font-weight:900;text-align:center}
.startup-logo{font-size:27px}
.startup-logo small,.logo small{display:block;color:#64748b;letter-spacing:2px;font-size:9px}
.startup-loader{width:28px;height:28px;margin:18px auto;border:3px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#startupScreen.hide{opacity:0;visibility:hidden;pointer-events:none;transition:.2s}

.app{max-width:650px;margin:auto;min-height:100vh;background:#fff;padding-bottom:calc(100px + env(safe-area-inset-bottom));box-shadow:0 0 25px #1e40af1a}

header{position:sticky;top:0;z-index:20;height:calc(62px + env(safe-area-inset-top));background:#fff;border-bottom:1px solid #dbe4f0;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.top-row{height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.logo{font-size:21px}
.language{position:absolute;right:2px;border:1px solid #cbd5e1;background:#f8fafc;border-radius:8px;padding:5px 6px;font-size:10px}

.auth{min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#dbeafe,#eff6ff,#fff)}
.auth-box{width:min(430px,100%);background:#fff;padding:25px;border-radius:22px;box-shadow:0 10px 35px #2563eb26;border:1px solid #dbeafe}
.auth-box h1{text-align:center;color:#2563eb;margin-bottom:6px}
.auth-subtitle{text-align:center;color:#64748b;font-size:13px;margin-bottom:18px}
.auth-box input,.search-box input,.modal-box input,.modal-box textarea,.modal-box select{width:100%;padding:13px;margin:6px 0;border:1px solid #cbd5e1;border-radius:11px;outline:0}
.auth-box input:focus,.search-box input:focus,.modal-box input:focus,.modal-box textarea:focus{border-color:#2563eb}
.auth-box button:not(.password-toggle),.primary{width:100%;padding:13px;margin-top:8px;border:0;border-radius:11px;background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;font-weight:bold}
.auth-switch{text-align:center;margin-top:13px;color:#2563eb;cursor:pointer}
.password-box{position:relative}
.password-box input{padding-right:55px!important}
.password-toggle{position:absolute!important;right:5px;top:5px;width:45px!important;height:42px;padding:5px!important;margin:0!important;background:transparent!important;color:#2563eb!important;border:0}
.status{text-align:center;padding:12px;color:#2563eb}

.screen{display:none}
.screen.active{display:block}

.arena-top{text-align:center;padding:20px 15px 10px}
.arena-title{font-size:30px;font-weight:900}
.arena-subtitle{margin-top:6px;color:#64748b;font-size:14px}

.categories{display:flex;gap:7px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
.category-btn,.top-tab{flex-shrink:0;border:1px solid #dbe4f0;background:#f8fafc;color:#475569;padding:8px 13px;border-radius:20px;font-size:12px;font-weight:bold}
.category-btn.active,.top-tab.active{background:#2563eb;border-color:#2563eb;color:#fff}

.create-duel{margin:14px;border-radius:17px;background:linear-gradient(135deg,#eff6ff,#f8fafc);border:1px solid #bfdbfe;padding:15px}
.create-duel button{width:100%;border:0;background:0;color:#2563eb;font-weight:bold;padding:8px;font-size:15px}

.duel{margin:10px 12px 18px;border:1px solid #dbe4f0;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 5px 18px #0f172a12}
.duel-head{padding:13px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.duel-category{background:#eff6ff;color:#2563eb;padding:6px 9px;border-radius:10px;font-size:11px;font-weight:bold}
.duel-type{background:#172033;color:#fff;padding:6px 9px;border-radius:10px;font-size:11px;font-weight:bold}
.duel-time{color:#dc2626;font-size:12px;font-weight:bold;background:#fef2f2;padding:4px 8px;border-radius:8px;border:1px solid #fecaca}
.duel-time.ended{color:#64748b;background:#f1f5f9;border-color:#e2e8f0}
.duel-author-row{padding:0 14px 8px;font-size:12px;color:#64748b;font-weight:bold;display:flex;align-items:center;gap:6px}
.duel-title{padding:0 14px 13px;font-size:18px;font-weight:bold}

.duel-options{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 8px 8px}
.option{border:2px solid #e2e8f0;border-radius:15px;overflow:hidden;background:#f8fafc}
.option:hover{border-color:#93c5fd}

.option-media{position:relative;width:100%;height:220px;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.option-media img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.option-media video{width:100%;height:100%;object-fit:cover;background:#000}

.option-placeholder{font-size:38px;color:#64748b}
.video-placeholder{font-size:46px}
.option-label{padding:10px 7px;text-align:center;font-weight:bold;font-size:14px;word-break:break-word}
.vote-button{width:calc(100% - 16px);margin:0 8px 8px;border:0;border-radius:12px;padding:12px;background:#2563eb;color:#fff;font-weight:bold;font-size:16px}
.vote-button:disabled{opacity:.55;cursor:not-allowed}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:43px;height:43px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#172033;color:#fff;font-size:13px;font-weight:900;box-shadow:0 4px 15px #0003}

.results{padding:10px 12px 14px;border-top:1px solid #e2e8f0}
.result-row{margin:7px 0}
.result-info{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:4px}
.result-info span{min-width:0;word-break:break-word}
.progress{height:9px;background:#e2e8f0;border-radius:20px;overflow:hidden}
.progress-fill{height:100%;min-width:0;background:linear-gradient(90deg,#2563eb,#60a5fa);border-radius:20px;transition:width .35s ease}

.duel-actions{display:flex;align-items:center;gap:8px;padding:8px 13px 12px;color:#64748b;font-size:12px;flex-wrap:wrap}
.duel-actions button{border:0;background:0;color:#64748b}
.owner-delete{color:#dc2626!important;font-weight:bold}
.admin-delete{color:#991b1b!important;font-weight:bold}
.duel-share-button{border:0!important;background:#f1f5f9!important;color:#2563eb!important;padding:7px 10px!important;border-radius:9px!important;font-weight:bold;display:flex;align-items:center;gap:5px}
.duel-total-votes{cursor:pointer;font-weight:bold;color:#2563eb}

.section-title{padding:20px 15px 8px;font-size:23px;font-weight:900}
.top-tabs{display:flex;gap:7px;padding:8px 14px}
.top-tab{flex:1;border-radius:10px;padding:9px;text-align:center}

.rank-item,.search-result{margin:8px 14px;padding:13px;border:1px solid #dbe4f0;border-radius:15px;display:flex;align-items:center;gap:12px}
.rank-number{width:34px;height:34px;border-radius:50%;background:#eff6ff;color:#2563eb;display:flex;align-items:center;justify-content:center;font-weight:bold}
.rank-main,.search-result-main{flex:1;min-width:0}
.rank-title{font-weight:bold}
.rank-category{color:#64748b;font-size:11px;margin-top:3px}
.rank-score{font-weight:bold;color:#2563eb;text-align:right}
.search-result{cursor:pointer}

.profile{padding:15px}
.profile-head{text-align:center;padding:15px 5px 20px;border-bottom:1px solid #dbe4f0}
.profile-big-avatar{width:90px;height:90px;margin:auto;border-radius:50%;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:45px;overflow:hidden;border:3px solid #3b82f6}
.profile-big-avatar img{width:100%;height:100%;object-fit:cover}
.profile-name{font-size:22px;font-weight:bold;margin-top:10px}
.profile-username{color:#64748b;margin-top:3px}
.profile-bio{margin:8px 0;color:#475569;white-space:pre-wrap}
.profile-stats{display:flex;justify-content:center;gap:35px;margin:18px 0}
.stat{text-align:center}
.stat-number{display:block;font-size:19px;font-weight:bold;color:#2563eb}
.stat-label{font-size:12px;color:#64748b}
.profile-buttons{display:flex;gap:8px;flex-wrap:wrap}
.profile-buttons button{flex:1;min-width:120px;border:0;border-radius:10px;padding:11px;background:#eff6ff;color:#1d4ed8}
.follow-button{background:#2563eb!important;color:#fff!important}
.admin-button{width:100%!important;flex-basis:100%;background:#172033!important;color:#fff!important}

.admin-panel{margin-top:15px;padding:15px;border:1px solid #bfdbfe;border-radius:15px;background:#eff6ff}
.admin-user-row{display:flex;align-items:center;gap:8px;padding:10px;margin-bottom:8px;background:#fff;border-radius:10px;border:1px solid #dbe4f0}
.admin-user-main{flex:1}
.admin-user-name{font-weight:bold}
.admin-active{color:#16a34a}
.admin-blocked{color:#dc2626;font-weight:bold}
.admin-action{border:0;padding:8px 10px;border-radius:8px;font-weight:bold}
.admin-block-button{background:#fee2e2;color:#b91c1c}
.admin-unblock-button{background:#dcfce7;color:#166534}

nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(650px,calc(100% - 24px));height:68px;background:#fff;border:1px solid #dbe4f0;border-radius:20px;display:flex;align-items:center;justify-content:space-around;z-index:50;box-shadow:0 10px 25px #0f172a15}
nav button{position:relative;flex:1;height:100%;border:0;background:transparent;color:#64748b;font-size:16px}
nav button span{font-size:10px}
nav button.add{flex:0 0 55px;width:55px;height:55px;margin-top:-28px;border-radius:50%;background:#2563eb;color:#fff;font-size:30px;box-shadow:0 6px 18px #2563eb55}

.modal{display:none;position:fixed;inset:0;background:#0f172a99;z-index:100;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal-box{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.modal-box h2{margin-bottom:12px;color:#2563eb}
.modal-box textarea{resize:vertical;min-height:90px}
.photo-button{display:block;padding:13px;margin:6px 0;border:2px dashed #60a5fa;border-radius:12px;text-align:center;color:#2563eb;font-weight:bold;background:#eff6ff}
#duelImageA,#duelImageB,#duelVideoA,#duelVideoB,#avatarInput{display:none}
.image-preview{display:none;width:100%;height:170px;margin:7px 0;border-radius:12px;overflow:hidden;background:#e2e8f0}
.image-preview img,.image-preview video{width:100%;height:100%;object-fit:cover}
.secondary{width:100%;padding:12px;margin-top:8px;border:0;border-radius:12px;background:#f1f5f9;color:#334155}
.empty{text-align:center;padding:35px 15px;color:#64748b}
.media-help{font-size:11px;color:#64748b;margin:4px 2px 8px}

@media(max-width:430px){
.arena-title{font-size:27px}
.option-media{height:180px}
.option-label{font-size:13px}
.vs{width:39px;height:39px}
.profile-stats{gap:23px}
}
</style>
</head>

<body>

<div id="startupScreen">
<div class="startup-box">
<div>
<div class="startup-logo">⚔️ ARENA<small>WHO BEATS WHO?</small></div>
<div class="startup-loader"></div>
</div>
</div>
</div>

<div id="auth" class="auth">
<div class="auth-box">
<h1>⚔️ ARENA</h1>
<div id="authSubtitle" class="auth-subtitle"></div>

<div id="loginBox">
<input id="loginEmail" type="email" autocomplete="email">
<div class="password-box">
<input id="loginPassword" type="password" autocomplete="current-password">
<button type="button" class="password-toggle" onclick="togglePassword('loginPassword',this)">👁️</button>
</div>
<button id="loginButton" type="button" onclick="login()"></button>
<div id="registerSwitch" class="auth-switch" onclick="showRegister()"></div>
</div>

<div id="registerBox" class="hidden">
<input id="regName" autocomplete="name">
<input id="regEmail" type="email" autocomplete="email">
<div class="password-box">
<input id="regPassword" type="password" autocomplete="new-password">
<button type="button" class="password-toggle" onclick="togglePassword('regPassword',this)">👁️</button>
</div>
<button id="registerButton" type="button" onclick="register()"></button>
<div id="loginSwitch" class="auth-switch" onclick="showLogin()"></div>
</div>

<div id="authStatus" class="status"></div>
</div>
</div>

<div id="app" class="app hidden">

<header>
<div class="top-row">
<div class="logo">⚔️ ARENA<small>WHO BEATS WHO?</small></div>
<select id="languageSelect" class="language" onchange="changeLanguage(this.value)">
<option value="ru">🇷🇺 RU</option>
<option value="ro">🇷🇴 RO</option>
<option value="en">🇬🇧 EN</option>
</select>
</div>
</header>

<div id="homeScreen" class="screen active">

<div class="arena-top">
<div id="arenaTitle" class="arena-title"></div>
<div id="arenaSubtitle" class="arena-subtitle"></div>
</div>

<div class="categories">
<button class="category-btn active" data-category="all" onclick="selectCategory('all',this)"></button>
<button class="category-btn" data-category="Фильмы" onclick="selectCategory('Фильмы',this)"></button>
<button class="category-btn" data-category="Музыка" onclick="selectCategory('Музыка',this)"></button>
<button class="category-btn" data-category="Игры" onclick="selectCategory('Игры',this)"></button>
<button class="category-btn" data-category="Спорт" onclick="selectCategory('Спорт',this)"></button>
<button class="category-btn" data-category="Мемы" onclick="selectCategory('Мемы',this)"></button>
<button class="category-btn" data-category="Авто" onclick="selectCategory('Авто',this)"></button>
<button class="category-btn" data-category="Другое" onclick="selectCategory('Другое',this)"></button>
</div>

<div class="create-duel">
<button onclick="openDuelModal()" id="createDuelButton"></button>
</div>

<div id="duelsFeed">
<div class="status" id="duelsStatus"></div>
</div>

</div>

<div id="topScreen" class="screen">
<div id="topTitle" class="section-title"></div>
<div class="top-tabs">
<button class="top-tab active" onclick="loadTop('all',this)" data-i18n="topAll">Все</button>
<button class="top-tab" onclick="loadTop('Фильмы',this)">🎬</button>
<button class="top-tab" onclick="loadTop('Игры',this)">🎮</button>
<button class="top-tab" onclick="loadTop('Музыка',this)">🎵</button>
</div>
<div id="topList"></div>
</div>

<div id="searchScreen" class="screen">
<div class="search-box" style="padding:15px">
<input id="searchInput">
</div>
<div id="searchResults"></div>
</div>

<div id="profileScreen" class="screen">
<div class="profile">
<div class="profile-head">

<div id="profileAvatar" class="profile-big-avatar">⚔️</div>
<div id="profileName" class="profile-name"></div>
<div id="profileUsername" class="profile-username">@arena</div>
<div id="profileBio" class="profile-bio"></div>

<div class="profile-stats">
<div class="stat"><span id="myDuelsCount" class="stat-number">0</span><span id="myDuelsLabel" class="stat-label"></span></div>
<div class="stat"><span id="myFollowersCount" class="stat-number">0</span><span id="myFollowersLabel" class="stat-label"></span></div>
<div class="stat"><span id="myFollowingCount" class="stat-number">0</span><span id="myFollowingLabel" class="stat-label"></span></div>
</div>

<div class="profile-buttons">
<button id="editProfileButton" type="button" onclick="openEditProfile()"></button>
<button id="logoutButton" type="button" onclick="logout()"></button>
<button id="adminButton" class="admin-button hidden" type="button" onclick="openAdminPanel()"></button>
</div>

<div id="adminPanel" class="admin-panel hidden">
<h3 id="adminTitle"></h3>
<br>
<div id="adminContent"></div>
</div>

</div>

<h3 id="myDuelsTitle" style="margin:18px 0 10px"></h3>
<div id="myDuels"></div>

</div>
</div>

<div id="otherProfileScreen" class="screen">
<div class="profile">
<div class="profile-head">

<div id="otherAvatar" class="profile-big-avatar">⚔️</div>
<div id="otherName" class="profile-name"></div>
<div id="otherUsername" class="profile-username">@arena</div>
<div id="otherBio" class="profile-bio"></div>

<div class="profile-stats">
<div class="stat"><span id="otherDuelsCount" class="stat-number">0</span><span class="stat-label">⚔️</span></div>
<div class="stat"><span id="otherFollowersCount" class="stat-number">0</span><span id="otherFollowersLabel" class="stat-label"></span></div>
<div class="stat"><span id="otherFollowingCount" class="stat-number">0</span><span id="otherFollowingLabel" class="stat-label"></span></div>
</div>

<div class="profile-buttons">
<button id="otherFollowButton" class="follow-button" type="button"></button>
<button id="otherBackButton" type="button" onclick="showScreen('homeScreen')"></button>
</div>

</div>

<h3 id="otherDuelsTitle" style="margin:18px 0 10px"></h3>
<div id="otherDuels"></div>

</div>
</div>

<nav>
<button type="button" onclick="showScreen('homeScreen')">⚔️<br><span data-nav="arena"></span></button>
<button type="button" onclick="showScreen('searchScreen')">🔍<br><span data-nav="search"></span></button>
<button class="add" type="button" onclick="openDuelModal()">＋</button>
<button type="button" onclick="showProfile()">👤<br><span data-nav="profile"></span></button>
</nav>

</div>

<div id="duelModal" class="modal">
<div class="modal-box">

<h2 id="duelModalTitle"></h2>

<input id="duelTitle">

<select id="duelCategory">
<option value="Фильмы" data-opt="films"></option>
<option value="Музыка" data-opt="music"></option>
<option value="Игры" data-opt="games"></option>
<option value="Спорт" data-opt="sport"></option>
<option value="Мемы" data-opt="memes"></option>
<option value="Авто" data-opt="auto"></option>
<option value="Другое" data-opt="other"></option>
</select>

<select id="duelType" onchange="toggleDuelType()">
<option value="photo" data-opt="photoBattle"></option>
<option value="video" data-opt="videoBattle"></option>
</select>

<select id="duelDuration">
<option value="24" data-opt="h24"></option>
<option value="48" selected data-opt="h48"></option>
<option value="72" data-opt="h72"></option>
<option value="0" data-opt="unlimited"></option>
</select>

<div id="photoFields">

<input id="duelOptionA">

<label class="photo-button">
<span id="photoAText"></span>
<input id="duelImageA" type="file" accept="image/*" onchange="previewDuelMedia('A',event,'image')">
</label>

<div id="previewA" class="image-preview">
<img id="previewAImage" alt="Preview A">
</div>

<input id="duelOptionB">

<label class="photo-button">
<span id="photoBText"></span>
<input id="duelImageB" type="file" accept="image/*" onchange="previewDuelMedia('B',event,'image')">
</label>

<div id="previewB" class="image-preview">
<img id="previewBImage" alt="Preview B">
</div>

</div>

<div id="videoFields" class="hidden">

<input id="duelVideoOptionA">

<label class="photo-button">
<span id="videoAText"></span>
<input id="duelVideoA" type="file" accept="video/*" onchange="previewDuelMedia('A',event,'video')">
</label>

<div id="previewVideoA" class="image-preview">
<video id="previewVideoAElement" controls playsinline></video>
</div>

<input id="duelVideoOptionB">

<label class="photo-button">
<span id="videoBText"></span>
<input id="duelVideoB" type="file" accept="video/*" onchange="previewDuelMedia('B',event,'video')">
</label>

<div id="previewVideoB" class="image-preview">
<video id="previewVideoBElement" controls playsinline></video>
</div>

<div class="media-help" data-i18n="maxPhotoHelp"></div>

</div>

<button id="duelSubmitButton" class="primary" type="button" onclick="createDuel()"></button>
<button id="duelCancelButton" class="secondary" type="button" onclick="closeModal('duelModal')"></button>

<div id="duelStatus" class="status"></div>

</div>
</div>

<div id="editModal" class="modal">
<div class="modal-box">

<h2 id="editProfileTitle"></h2>

<label class="photo-button">
<span id="avatarText"></span>
<input id="avatarInput" type="file" accept="image/*" onchange="previewAvatar(event)">
</label>

<div id="avatarPreview" class="image-preview">
<img id="avatarPreviewImage" alt="Avatar Preview">
</div>

<input id="editName">
<input id="editUsername">
<textarea id="editBio"></textarea>

<button id="saveProfileButton" class="primary" type="button" onclick="saveProfile()"></button>
<button id="editCancelButton" class="secondary" type="button" onclick="closeModal('editModal')"></button>

<div id="profileStatus" class="status"></div>

</div>
</div>

<div id="votersModal" class="modal">
<div class="modal-box">
<h2>👥 Кто за кого голосовал</h2>
<div id="votersModalContent" style="max-height:50vh;overflow-y:auto;margin-bottom:15px"></div>
<button class="secondary" type="button" onclick="closeModal('votersModal')">Закрыть</button>
</div>
</div>

function rnd(){
if(window.crypto?.getRandomValues){
const a=new Uint32Array(2);
crypto.getRandomValues(a);
return a[0].toString(36)+a[1].toString(36);
}
return Math.random().toString(36).slice(2);
}

function formatCountdown(expiresAt){
if(!expiresAt)return{text:t("unlimited"),ended:false};
const end=new Date(expiresAt).getTime();
const now=Date.now();
const diff=end-now;

if(diff<=0){
return{text:t("battleEnded"),ended:true};
}

const hours=Math.floor(diff/(1000*60*60));
const minutes=Math.floor((diff%(1000*60*60))/(1000*60));
const seconds=Math.floor((diff%(1000*60))/1000);

const h=String(hours).padStart(2,"0");
const m=String(minutes).padStart(2,"0");
const s=String(seconds).padStart(2,"0");

return{text:`⏳ ${h}:${m}:${s}`,ended:false};
}

function startCountdownTimers(){

}

function authError(e){
const m=String(e?.message||"").toLowerCase();

if(m.includes("invalid login")||m.includes("invalid credentials"))
return t("wrongLogin");

if(m.includes("email not confirmed"))
return t("emailNotConfirmed");

if(m.includes("fetch")||m.includes("network"))
return t("connection");

return e?.message||"Ошибка";
}

async function getUniqueFullName(requestedName) {
    let finalName = requestedName;
    let counter = 1;

    while (true) {
        const check = await db.from("profiles")
            .select("id")
            .ilike("full_name", finalName)
            .maybeSingle();

        if (!check.data) {
            break;
        }

        finalName = `${requestedName} ${counter}`;
        counter++;
    }

    return finalName;
}

async function register(){
const rawName=$("regName").value.trim();
const email=$("regEmail").value.trim().toLowerCase();
const pass=$("regPassword").value;
const status=$("authStatus");

if(!rawName||!email||!pass){
status.innerText=t("invalid");
return;
}

if(pass.length<6){
status.innerText=t("passwordLength");
return;
}

$("registerButton").disabled=true;
status.innerText=t("creatingAccount");

try{
const name = await getUniqueFullName(rawName);
const username="arena_"+rnd();

const r=await db.auth.signUp({
email,
password:pass,
options:{
data:{
full_name:name,
username
}
}
});

if(r.error)throw r.error;

if(r.data.user){
const p=await db.from("profiles").upsert({
id:r.data.user.id,
full_name:name,
username
},{onConflict:"id"});

if(p.error)console.warn("Profile:",p.error);
}

if(r.data.session){
currentUser=r.data.user;
await startApp();
}else{
status.innerText=t("checkingEmail");
showLogin();
}

}catch(e){
status.innerText=authError(e);
}

$("registerButton").disabled=false;
}

async function login(){
const email=$("loginEmail").value.trim().toLowerCase();
const pass=$("loginPassword").value;
const status=$("authStatus");

if(!email||!pass){
status.innerText=t("enterCredentials");
return;
}

if(!db){
status.innerText=t("connection");
return;
}

$("loginButton").disabled=true;
status.innerText=t("loggingIn");

try{
const r=await db.auth.signInWithPassword({
email,
password:pass
});

if(r.error)throw r.error;

if(!r.data?.session||!r.data?.user)
throw new Error("Не удалось получить сессию.");

currentUser=r.data.user;
await startApp();

}catch(e){
status.innerText=authError(e);
$("loginButton").disabled=false;
}
}

async function logout(){

await db.auth.signOut();

localStorage.removeItem("arena_last_screen");

showLogin();
}

async function startApp(){
try{
if(!currentUser){
const sessionPromise=db.auth.getSession();
const timeoutPromise=new Promise((_,reject)=>
setTimeout(()=>reject(new Error("Auth timeout")),10000)
);

const s=await Promise.race([
sessionPromise,
timeoutPromise
]);

if(!s.data?.session){
showAuth();
showLogin();
return;
}

currentUser=s.data.session.user;
}

try{
await Promise.race([
loadProfile(),
new Promise((_,reject)=>
setTimeout(()=>reject(new Error("Profile timeout")),10000)
)
]);
}catch(e){}

if(currentProfile?.is_blocked){
alert(t("blockedAccount"));
await db.auth.signOut();
currentUser=null;
currentProfile=null;
showAuth();
showLogin();
return;
}

$("auth").style.display="none";
$("app").classList.remove("hidden");

const screen=localStorage.getItem("arena_last_screen")||"homeScreen";

showScreen(screen);

Promise.allSettled([
loadDuels()
]);

if(screen==="profileScreen")
showProfile();

}catch(e){
try{
showAuth();
showLogin();
}catch(_){}
}finally{
hideStartup();
}
}

async function shareDuel(id, button){
const duelId = String(id);
const url = window.location.origin + window.location.pathname + "?duel=" + encodeURIComponent(duelId);
const title = "⚔️ ARENA — Кто победит?";
const text = "Голосуй в открытом голосовании!";

try {
  if (navigator.share) {
    await navigator.share({ title, text, url });
    return;
  }
} catch (e) {
  if (e?.name === "AbortError") return;
}

try {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    await navigator.clipboard.writeText(url);
    if (button) {
      const origText = button.innerHTML;
      button.innerText = t("shareCopied");
      setTimeout(() => button.innerHTML = origText, 1800);
    }
    return;
  }
} catch (err) {}

const textarea = document.createElement("textarea");
textarea.value = url;
textarea.style.position = "fixed";
textarea.style.opacity = "0";
document.body.appendChild(textarea);
textarea.focus();
textarea.select();

try {
  const successful = document.execCommand("copy");
  textarea.remove();
  if (successful) {
    if (button) {
      const origText = button.innerHTML;
      button.innerText = t("shareCopied");
      setTimeout(() => button.innerHTML = origText, 1800);
    }
    return;
  }
} catch (err) {
  textarea.remove();
}

prompt("Скопируйте ссылку на дуэль:", url);
}

async function getDuelVoteCounts(id){
const duelId=String(id);

const r=await db.from("duel_votes")
.select("choice")
.eq("duel_id",duelId);

if(r.error)throw r.error;

let a=0;
let b=0;

for(const row of r.data||[]){
const choice=String(row.choice||"").toLowerCase();
if(choice==="a")a++;
if(choice==="b")b++;
}

const total=a+b;
let pa=0;
let pb=0;

if(total>0){
pa=Math.round((a/total)*100);
pb=100-pa;
}

return{a,b,total,pa,pb};
}

async function voteDuel(id,choice,button){
if(!currentUser||!["a","b"].includes(choice))
return;

const card=button.closest(".duel");
if(!card)return;

const buttons=card.querySelectorAll(".vote-button");
buttons.forEach(b=>b.disabled=true);

try{
const duelId=String(id);

const existing=await db.from("duel_votes")
.select("id,choice")
.eq("duel_id",duelId)
.eq("user_id",currentUser.id)
.maybeSingle();

if(existing.error)throw existing.error;

if(existing.data){
const existingChoice=existing.data.choice;
await updateDuelVoteCard(card,duelId,existingChoice);
return;
}

const insert=await db.from("duel_votes")
.insert({
duel_id:duelId,
user_id:currentUser.id,
choice
})
.select("id,choice")
.maybeSingle();

if(insert.error){
const msg=String(insert.error.message||"").toLowerCase();

if(
msg.includes("duplicate")||
msg.includes("unique")||
msg.includes("already exists")
){
await updateDuelVoteCard(card,duelId,await getVote(duelId));
return;
}
throw insert.error;
}

await updateDuelVoteCard(card,duelId,choice);

}catch(e){
alert(e.message||t("connection"));
buttons.forEach(b=>b.disabled=false);
}
}

async function updateDuelVoteCard(card,duelId,vote){

const resultA=card.querySelector(".result-a-text");
const resultB=card.querySelector(".result-b-text");
const percentA=card.querySelector(".result-a-percent");
const percentB=card.querySelector(".result-b-percent");
const fillA=card.querySelector(".result-a-fill");
const fillB=card.querySelector(".result-b-fill");
const total=card.querySelector(".duel-total-votes");

const labels=card.querySelectorAll(".option-label");
const labelA=labels[0]?.innerText||"A";
const labelB=labels[1]?.innerText||"B";

if(resultA)
resultA.innerText=`A — ${labelA} · ${counts.a} ${t("votes")}`;

if(resultB)
resultB.innerText=`B — ${labelB} · ${counts.b} ${t("votes")}`;

if(percentA)
percentA.innerText=`${counts.pa}%`;

if(percentB)
percentB.innerText=`${counts.pb}%`;

if(fillA)
fillA.style.width=`${counts.pa}%`;

if(fillB)
fillB.style.width=`${counts.pb}%`;

if(total)
total.innerHTML=`🗳️ ${counts.total} ${t("votes")}`;

const buttons=card.querySelectorAll(".vote-button");

buttons.forEach((btn,index)=>{
btn.disabled=true;

if(vote==="a"&&index===0)
btn.innerText=t("yourChoice");
else if(vote==="b"&&index===1)
btn.innerText=t("yourChoice");
else
btn.innerText="❤️";
});
}

function previewDuelMedia(side,event,type){
const file=event.target.files?.[0];
if(!file)return;

if(file.size>100*1024*1024){
alert(t("maxPhoto"));
event.target.value="";
return;
}

if(type==="image"&&!file.type.startsWith("image/"))return;
if(type==="video"&&!file.type.startsWith("video/"))return;

const reader=new FileReader();

reader.onload=e=>{
if(type==="image"){
if(side==="A"){
selectedImageA=file;
$("previewAImage").src=e.target.result;
$("previewA").style.display="block";
}else{
selectedImageB=file;
$("previewBImage").src=e.target.result;
$("previewB").style.display="block";
}
}else{
if(side==="A"){
selectedVideoA=file;
$("previewVideoAElement").src=e.target.result;
$("previewVideoA").style.display="block";
}else{
selectedVideoB=file;
$("previewVideoBElement").src=e.target.result;
$("previewVideoB").style.display="block";
}
}
};

reader.readAsDataURL(file);
}

async function upload(file, folder){
if(!file)return"";

const ext=(file.name.split(".").pop()||"bin")
.replace(/[^a-z0-9]/gi,"")||"bin";

const path=
`${folder}/${currentUser.id}-${Date.now()}-${rnd()}.${ext}`;

const bucketName = "Photos";

const r=await db.storage
.from(bucketName)
.upload(path,file,{
upsert:true,
contentType: file.type || "application/octet-stream"
});

if(r.error)throw r.error;

return db.storage
.from(bucketName)
.getPublicUrl(path)
.data.publicUrl;
}

async function createDuel(){
const title=$("duelTitle").value.trim();
const type=$("duelType").value;
const category=$("duelCategory").value;
const duration=parseInt($("duelDuration").value,10);
const status=$("duelStatus");

let optionA="";
let optionB="";

if(type==="video"){
optionA=$("duelVideoOptionA").value.trim();
optionB=$("duelVideoOptionB").value.trim();
}else{
optionA=$("duelOptionA").value.trim();
optionB=$("duelOptionB").value.trim();
}

if(!title||!optionA||!optionB){
status.innerText=t("invalid");
return;
}

if(type==="video"&&!selectedVideoA&&!selectedVideoB){
status.innerText=t("videoRequired");
return;
}

if(title.length>300){
status.innerText=t("tooLongTitle");
return;
}

if(optionA.length>200||optionB.length>200){
status.innerText=t("tooLongOption");
return;
}

$("duelSubmitButton").disabled=true;

try{
status.innerText=t("uploading");

let imageA="";
let imageB="";
let videoA="";
let videoB="";

if(type==="video"){
if(selectedVideoA)
videoA=await upload(selectedVideoA,"videos");

if(selectedVideoB)
videoB=await upload(selectedVideoB,"videos");
}else{
if(selectedImageA)
imageA=await upload(selectedImageA,"duels");

if(selectedImageB)
imageB=await upload(selectedImageB,"duels");
}

status.innerText=t("creatingDuel");

const expiresAt=duration>0?new Date(Date.now()+duration*3600*1000).toISOString():null;

const payload={
user_id:currentUser.id,
title,
category,
duration_hours:duration,
expires_at:expiresAt,
option_a:type==="photo"?optionA:"",
option_b:type==="photo"?optionB:"",
image_a:imageA,
image_b:imageB,
video_option_a:type==="video"?optionA:"",
video_option_b:type==="video"?optionB:"",
video_a:videoA,
video_b:videoB,
votes_a:0,
votes_b:0
};

const r=await db.from("duels").insert(payload);
if(r.error)throw r.error;

closeModal("duelModal");
await loadDuels();
await updateStats();

if($("profileScreen").classList.contains("active"))
await loadMyDuels();

alert(t("created"));

}catch(e){
status.innerText=e.message||t("connection");
}

$("duelSubmitButton").disabled=false;
}

async function saveProfile(){
const rawName=$("editName").value.trim();
const username=$("editUsername").value.trim();
const bio=$("editBio").value.trim();
const status=$("profileStatus");

if(!rawName){
status.innerText=t("nameRequired");
return;
}

status.innerText=t("saving");

try{
let name = rawName;
if(rawName.toLowerCase() !== (currentProfile?.full_name || "").toLowerCase()){
    name = await getUniqueFullName(rawName);
}

let avatar=currentProfile?.avatar_url||"";

if(selectedAvatar)
avatar=await upload(selectedAvatar,"avatars");

const r=await db.from("profiles")
.update({
full_name:name,
username:username||null,
bio,
avatar_url:avatar
})
.eq("id",currentUser.id)
.select()
.single();

if(r.error)throw r.error;

currentProfile=r.data;

await db.auth.updateUser({
data:{
full_name:name,
username:username||null
}
});

await loadProfile();
closeModal("editModal");

}catch(e){
status.innerText=e.message||t("connection");
}
}

async function adminBlock(id,blocked){

?(language==="ru"?"Разблокировать пользователя?":language==="ro"?"Deblochezi utilizatorul?":"Unblock user?")
:(language==="ru"?"Заблокировать пользователя?":language==="ro"?"Blochezi utilizatorul?":"Block user?");

const actionButtonText = blocked ? t("unblockAction") : t("blockAction");

showCustomConfirm(question, async () => {
const r=await db.rpc("admin_set_blocked",{
target_user_id:id,
blocked_value:!blocked
});

if(r.error){
alert(r.error.message);
return;
}

await loadAdminUsers();
}, actionButtonText);
}

}

});

document.addEventListener("DOMContentLoaded", async () => {
try{
    let attempts = 0;
    while (!window.supabase && attempts < 20) {
        await new Promise(r => setTimeout(r, 100));
        attempts++;
    }

    if(!["ru","ro","en"].includes(language))
    language="ru";

    applyLanguage();
    startCountdownTimers();

    $("searchInput")?.addEventListener("input",searchUsers);

    if(!initDB()){
        hideStartup();
        showAuth();
        showLogin();
        return;
    }

    const sessionResult=await db.auth.getSession();
    const session=sessionResult.data?.session;

    if(session){
        currentUser=session.user;
        await startApp();
    }else{
        showAuth();
        showLogin();
        hideStartup();
    }

    db.auth.onAuthStateChange(async(event,session)=>{
        if(event==="SIGNED_OUT"){
            currentUser=null;
            currentProfile=null;
            showAuth();
            showLogin();
            hideStartup();
            return;
        }

        if(event==="TOKEN_REFRESHED"&&session){
            currentUser=session.user;
            return;
        }

        if(event==="SIGNED_IN"&&session){
            currentUser=session.user;
            if($("app").classList.contains("hidden")){
                try{
                    await startApp();
                }catch(e){}
            }
        }
    });

}catch(e){
    showAuth();
    $("authStatus").innerText=t("connection");
    hideStartup();
}
});
</script>

        });
