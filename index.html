<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARENA — Who Beats Who</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:#eef5ff;font-family:Arial,sans-serif;color:#172033}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

#startupScreen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#eef5ff}
.startup-box{width:min(650px,100%);height:100vh;display:flex;align-items:center;justify-content:center;background:#fff}
.startup-logo,.logo{color:#2563eb;font-weight:900;text-align:center}
.startup-logo{font-size:27px}
.startup-logo small,.logo small{display:block;color:#64748b;letter-spacing:2px;font-size:9px}
.startup-loader{width:28px;height:28px;margin:18px auto;border:3px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#startupScreen.hide{opacity:0;visibility:hidden;pointer-events:none;transition:.2s}

.app{max-width:650px;margin:auto;min-height:100vh;background:#fff;padding-bottom:80px;box-shadow:0 0 25px #1e40af1a}

header{position:sticky;top:0;z-index:20;height:62px;background:#fff;border-bottom:1px solid #dbe4f0;padding:8px 12px}
.top-row{height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.logo{font-size:21px}
.language{position:absolute;right:2px;border:1px solid #cbd5e1;background:#f8fafc;border-radius:8px;padding:5px 6px;font-size:10px}

.auth{min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#dbeafe,#eff6ff,#fff)}
.auth-box{width:min(430px,100%);background:#fff;padding:25px;border-radius:22px;box-shadow:0 10px 35px #2563eb26;border:1px solid #dbeafe}
.auth-box h1{text-align:center;color:#2563eb;margin-bottom:6px}
.auth-subtitle{text-align:center;color:#64748b;font-size:13px;margin-bottom:18px}
.auth-box input,.search-box input,.modal-box input,.modal-box textarea,.modal-box select{width:100%;padding:13px;margin:6px 0;border:1px solid #cbd5e1;border-radius:11px;outline:0}
.auth-box input:focus,.search-box input:focus,.modal-box input:focus,.modal-box textarea:focus{border-color:#2563eb}
.auth-box button:not(.password-toggle),.primary{width:100%;padding:13px;margin-top:8px;border:0;border-radius:11px;background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;font-weight:bold}
.auth-switch{text-align:center;margin-top:13px;color:#2563eb;cursor:pointer}
.password-box{position:relative}
.password-box input{padding-right:55px!important}
.password-toggle{position:absolute!important;right:5px;top:5px;width:45px!important;height:42px;padding:5px!important;margin:0!important;background:transparent!important;color:#2563eb!important;border:0}
.status{text-align:center;padding:12px;color:#2563eb}

.screen{display:none}
.screen.active{display:block}

.arena-top{text-align:center;padding:20px 15px 10px}
.arena-title{font-size:30px;font-weight:900}
.arena-subtitle{margin-top:6px;color:#64748b;font-size:14px}

.categories{display:flex;gap:7px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
.category-btn,.top-tab{flex-shrink:0;border:1px solid #dbe4f0;background:#f8fafc;color:#475569;padding:8px 13px;border-radius:20px;font-size:12px;font-weight:bold}
.category-btn.active,.top-tab.active{background:#2563eb;border-color:#2563eb;color:#fff}

.create-duel{margin:14px;border-radius:17px;background:linear-gradient(135deg,#eff6ff,#f8fafc);border:1px solid #bfdbfe;padding:15px}
.create-duel button{width:100%;border:0;background:0;color:#2563eb;font-weight:bold;padding:8px;font-size:15px}

.duel{margin:10px 12px 18px;border:1px solid #dbe4f0;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 5px 18px #0f172a12}
.duel-head{padding:13px 14px;display:flex;justify-content:space-between;gap:10px}
.duel-category{background:#eff6ff;color:#2563eb;padding:6px 9px;border-radius:10px;font-size:11px;font-weight:bold}
.duel-type{background:#172033;color:#fff;padding:6px 9px;border-radius:10px;font-size:11px;font-weight:bold}
.duel-time{color:#94a3b8;font-size:11px}
.duel-title{padding:0 14px 13px;font-size:18px;font-weight:bold}

.duel-options{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 8px 8px}
.option{border:2px solid #e2e8f0;border-radius:15px;overflow:hidden;background:#f8fafc}
.option:hover{border-color:#93c5fd}
.option-media{height:205px;background:#e2e8f0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.option-media img,.option-media video{width:100%;height:100%;object-fit:cover}
.option-media video{background:#000}
.option-placeholder{font-size:38px;color:#64748b}
.video-placeholder{font-size:46px}
.option-label{padding:10px 7px;text-align:center;font-weight:bold;font-size:14px;word-break:break-word}
.vote-button{width:calc(100% - 16px);margin:0 8px 8px;border:0;border-radius:12px;padding:12px;background:#2563eb;color:#fff;font-weight:bold}
.vote-button:disabled{opacity:.55;cursor:not-allowed}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:43px;height:43px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#172033;color:#fff;font-size:13px;font-weight:900;box-shadow:0 4px 15px #0003}

.results{padding:10px 12px 14px;border-top:1px solid #e2e8f0}
.result-row{margin:7px 0}
.result-info{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:4px}
.result-info span{min-width:0;word-break:break-word}
.progress{height:9px;background:#e2e8f0;border-radius:20px;overflow:hidden}
.progress-fill{height:100%;min-width:0;background:linear-gradient(90deg,#2563eb,#60a5fa);border-radius:20px;transition:width .35s ease}

.duel-actions{display:flex;align-items:center;gap:8px;padding:8px 13px 12px;color:#64748b;font-size:12px;flex-wrap:wrap}
.duel-actions button{border:0;background:0;color:#64748b}
.owner-delete{color:#dc2626!important;font-weight:bold}
.admin-delete{color:#991b1b!important;font-weight:bold}
.duel-chat-button{border:0!important;background:#eff6ff!important;color:#2563eb!important;padding:7px 10px!important;border-radius:9px!important;font-weight:bold}
.duel-share-button{border:0!important;background:#f1f5f9!important;color:#2563eb!important;padding:7px 10px!important;border-radius:9px!important;font-weight:bold}

.duel-chat{border-top:1px solid #dbe4f0;background:#f8fafc;padding:10px}
.duel-chat-messages{max-height:280px;overflow:auto;padding:5px 2px 8px}
.duel-chat-form{display:flex;gap:6px}
.duel-chat-input{flex:1;min-width:0;border:1px solid #cbd5e1;border-radius:10px;padding:10px;resize:none;height:42px;outline:0;background:#fff}
.duel-chat-send{width:44px;border:0;border-radius:10px;background:#2563eb;color:#fff}
.duel-message{display:flex;margin:7px 0}
.duel-message.mine{justify-content:flex-end}
.duel-message-content{max-width:82%;padding:8px 10px;border-radius:13px;background:#fff;border:1px solid #dbe4f0}
.duel-message.mine .duel-message-content{background:#2563eb;color:#fff;border-color:#2563eb}
.duel-message-author{font-size:10px;color:#2563eb;font-weight:bold;margin-bottom:3px}
.duel-message.mine .duel-message-author{color:#dbeafe}
.duel-message-text{font-size:13px;white-space:pre-wrap;word-break:break-word}
.duel-message-time{font-size:8px;color:#94a3b8;text-align:right;margin-top:3px}
.duel-message.mine .duel-message-time{color:#dbeafe}
.duel-chat-tools{text-align:right}
.duel-chat-tools button{border:0;background:0;font-size:9px;color:#64748b}

.section-title{padding:20px 15px 8px;font-size:23px;font-weight:900}
.top-tabs{display:flex;gap:7px;padding:8px 14px}
.top-tab{flex:1;border-radius:10px;padding:9px;text-align:center}

.rank-item,.search-result,.chat-user{margin:8px 14px;padding:13px;border:1px solid #dbe4f0;border-radius:15px;display:flex;align-items:center;gap:12px}
.rank-number{width:34px;height:34px;border-radius:50%;background:#eff6ff;color:#2563eb;display:flex;align-items:center;justify-content:center;font-weight:bold}
.rank-main,.chat-user-main,.search-result-main{flex:1;min-width:0}
.rank-title{font-weight:bold}
.rank-category,.chat-user-last{color:#64748b;font-size:11px;margin-top:3px}
.rank-score{font-weight:bold;color:#2563eb;text-align:right}
.search-result{cursor:pointer}

.profile{padding:15px}
.profile-head{text-align:center;padding:15px 5px 20px;border-bottom:1px solid #dbe4f0}
.profile-big-avatar{width:90px;height:90px;margin:auto;border-radius:50%;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:45px;overflow:hidden;border:3px solid #3b82f6}
.profile-big-avatar img{width:100%;height:100%;object-fit:cover}
.profile-name{font-size:22px;font-weight:bold;margin-top:10px}
.profile-username{color:#64748b;margin-top:3px}
.profile-bio{margin:8px 0;color:#475569;white-space:pre-wrap}
.profile-stats{display:flex;justify-content:center;gap:35px;margin:18px 0}
.stat{text-align:center}
.stat-number{display:block;font-size:19px;font-weight:bold;color:#2563eb}
.stat-label{font-size:12px;color:#64748b}
.profile-buttons{display:flex;gap:8px;flex-wrap:wrap}
.profile-buttons button{flex:1;min-width:120px;border:0;border-radius:10px;padding:11px;background:#eff6ff;color:#1d4ed8}
.follow-button{background:#2563eb!important;color:#fff!important}
.message-button{background:#172033!important;color:#fff!important}
.admin-button{width:100%!important;flex-basis:100%;background:#172033!important;color:#fff!important}

.admin-panel{margin-top:15px;padding:15px;border:1px solid #bfdbfe;border-radius:15px;background:#eff6ff}
.admin-user-row{display:flex;align-items:center;gap:8px;padding:10px;margin-bottom:8px;background:#fff;border-radius:10px;border:1px solid #dbe4f0}
.admin-user-main{flex:1}
.admin-user-name{font-weight:bold}
.admin-active{color:#16a34a}
.admin-blocked{color:#dc2626;font-weight:bold}
.admin-action{border:0;padding:8px 10px;border-radius:8px;font-weight:bold}
.admin-block-button{background:#fee2e2;color:#b91c1c}
.admin-unblock-button{background:#dcfce7;color:#166534}

.chat-box{margin:0 12px;border:1px solid #dbe4f0;border-radius:18px;overflow:hidden}
.chat-messages{height:55vh;min-height:350px;max-height:600px;overflow:auto;padding:12px;background:#f8fafc}
.message{display:flex;margin:8px 0}
.message.mine{justify-content:flex-end}
.message-content{max-width:78%;padding:9px 12px;border-radius:15px;background:#fff;border:1px solid #dbe4f0}
.message.mine .message-content{background:#2563eb;color:#fff;border-color:#2563eb}
.message-author{font-size:11px;font-weight:bold;color:#2563eb;margin-bottom:4px}
.message-text{font-size:14px;white-space:pre-wrap;word-break:break-word}
.message-time{font-size:9px;color:#94a3b8;margin-top:4px;text-align:right}
.message-tools{text-align:right}
.message-tools button{border:0;background:0;color:#64748b;font-size:10px}
.chat-input-area{display:flex;gap:7px;padding:10px;border-top:1px solid #dbe4f0}
.chat-input{flex:1;min-width:0;border:1px solid #cbd5e1;border-radius:12px;padding:11px;resize:none;height:45px;outline:0}
.chat-send{width:48px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-size:20px}

.unread-badge{min-width:22px;height:22px;padding:0 6px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:#dc2626;color:#fff;font-size:10px;font-weight:bold}
.chat-back,.new-message-button{border:0;background:#eff6ff;color:#2563eb;padding:9px 12px;border-radius:10px;font-weight:bold;margin:10px 14px}
.new-message-button{width:calc(100% - 28px);padding:12px}
.chat-person-title{display:flex;align-items:center;gap:10px;margin:0 14px 10px}

nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(650px,calc(100% - 24px));height:68px;background:#fff;border:1px solid #dbe4f0;border-radius:20px;display:flex;align-items:center;justify-content:space-around;z-index:50;box-shadow:0 10px 25px #0f172a15}
nav button{position:relative;flex:1;height:100%;border:0;background:transparent;color:#64748b;font-size:16px}
nav button span{font-size:10px}
nav button.add{flex:0 0 55px;width:55px;height:55px;margin-top:-28px;border-radius:50%;background:#2563eb;color:#fff;font-size:30px;box-shadow:0 6px 18px #2563eb55}
.nav-unread{position:absolute;top:5px;right:25%;min-width:18px;height:18px;padding:0 5px;border-radius:20px;background:#dc2626;color:#fff;font-size:9px!important;display:none;align-items:center;justify-content:center}

.modal{display:none;position:fixed;inset:0;background:#0f172a99;z-index:100;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal-box{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px}
.modal-box h2{margin-bottom:12px;color:#2563eb}
.modal-box textarea{resize:vertical;min-height:90px}
.photo-button{display:block;padding:13px;margin:6px 0;border:2px dashed #60a5fa;border-radius:12px;text-align:center;color:#2563eb;font-weight:bold;background:#eff6ff}
#duelImageA,#duelImageB,#duelVideoA,#duelVideoB,#avatarInput{display:none}
.image-preview{display:none;width:100%;height:170px;margin:7px 0;border-radius:12px;overflow:hidden;background:#e2e8f0}
.image-preview img,.image-preview video{width:100%;height:100%;object-fit:cover}
.secondary{width:100%;padding:12px;margin-top:8px;border:0;border-radius:12px;background:#f1f5f9;color:#334155}
.empty{text-align:center;padding:35px 15px;color:#64748b}
.media-help{font-size:11px;color:#64748b;margin:4px 2px 8px}

@media(max-width:430px){
.arena-title{font-size:27px}
.option-media{height:170px}
.option-label{font-size:13px}
.vs{width:39px;height:39px}
.profile-stats{gap:23px}
.message-content{max-width:86%}
.duel-message-content{max-width:88%}
}
</style>
</head>

<body>

<div id="startupScreen">
<div class="startup-box">
<div>
<div class="startup-logo">⚔️ ARENA<small>WHO BEATS WHO?</small></div>
<div class="startup-loader"></div>
</div>
</div>
</div>

<div id="auth" class="auth">
<div class="auth-box">
<h1>⚔️ ARENA</h1>
<div id="authSubtitle" class="auth-subtitle"></div>

<div id="loginBox">
<input id="loginEmail" type="email" autocomplete="email">
<div class="password-box">
<input id="loginPassword" type="password" autocomplete="current-password">
<button type="button" class="password-toggle" onclick="togglePassword('loginPassword',this)">👁️</button>
</div>
<button id="loginButton" type="button" onclick="login()"></button>
<div id="registerSwitch" class="auth-switch" onclick="showRegister()"></div>
</div>

<div id="registerBox" class="hidden">
<input id="regName" autocomplete="name">
<input id="regEmail" type="email" autocomplete="email">
<div class="password-box">
<input id="regPassword" type="password" autocomplete="new-password">
<button type="button" class="password-toggle" onclick="togglePassword('regPassword',this)">👁️</button>
</div>
<button id="registerButton" type="button" onclick="register()"></button>
<div id="loginSwitch" class="auth-switch" onclick="showLogin()"></div>
</div>

<div id="authStatus" class="status"></div>
</div>
</div>

<div id="app" class="app hidden">

<header>
<div class="top-row">
<div class="logo">⚔️ ARENA<small>WHO BEATS WHO?</small></div>
<select id="languageSelect" class="language" onchange="changeLanguage(this.value)">
<option value="ru">🇷🇺 RU</option>
<option value="ro">🇷🇴 RO</option>
<option value="en">🇬🇧 EN</option>
</select>
</div>
</header>

<div id="homeScreen" class="screen active">

<div class="arena-top">
<div id="arenaTitle" class="arena-title"></div>
<div id="arenaSubtitle" class="arena-subtitle"></div>
</div>

<div class="categories">
<button class="category-btn active" data-category="all" onclick="selectCategory('all',this)"></button>
<button class="category-btn" data-category="Фильмы" onclick="selectCategory('Фильмы',this)"></button>
<button class="category-btn" data-category="Музыка" onclick="selectCategory('Музыка',this)"></button>
<button class="category-btn" data-category="Игры" onclick="selectCategory('Игры',this)"></button>
<button class="category-btn" data-category="Спорт" onclick="selectCategory('Спорт',this)"></button>
<button class="category-btn" data-category="Мемы" onclick="selectCategory('Мемы',this)"></button>
<button class="category-btn" data-category="Авто" onclick="selectCategory('Авто',this)"></button>
<button class="category-btn" data-category="Другое" onclick="selectCategory('Другое',this)"></button>
</div>

<div class="create-duel">
<button onclick="openDuelModal()" id="createDuelButton"></button>
</div>

<div id="duelsFeed">
<div class="status" id="duelsStatus"></div>
</div>

</div>

<div id="topScreen" class="screen">
<div id="topTitle" class="section-title"></div>
<div class="top-tabs">
<button class="top-tab active" onclick="loadTop('all',this)">Все</button>
<button class="top-tab" onclick="loadTop('Фильмы',this)">🎬</button>
<button class="top-tab" onclick="loadTop('Игры',this)">🎮</button>
<button class="top-tab" onclick="loadTop('Музыка',this)">🎵</button>
</div>
<div id="topList"></div>
</div>

<div id="searchScreen" class="screen">
<div class="search-box" style="padding:15px">
<input id="searchInput">
</div>
<div id="searchResults"></div>
</div>

<div id="notificationsScreen" class="screen">
<div id="notificationsTitle" class="section-title"></div>
<div id="notificationsText" class="empty"></div>
</div>

<div id="chatScreen" class="screen">

<div class="section-title">
✉️ <span data-i18n="privateMessages"></span>
</div>

<div id="privateChatList">
<button id="newMessageButton" class="new-message-button" type="button" onclick="openNewMessageModal()"></button>
<div id="conversationList"></div>
</div>

<div id="privateChat" class="hidden">

<button id="privateBackButton" class="chat-back" type="button" onclick="showConversationList()"></button>

<div class="chat-person-title">
<div id="privatePersonAvatar" class="profile-big-avatar" style="width:45px;height:45px;font-size:22px">⚔️</div>
<div class="chat-user-main">
<div id="privatePersonName"></div>
<div id="privatePersonUsername" class="chat-user-last">@arena</div>
</div>
</div>

<div class="chat-box">
<div id="privateMessages" class="chat-messages"></div>
<div class="chat-input-area">
<textarea id="privateMessageInput" class="chat-input" maxlength="2000"></textarea>
<button class="chat-send" type="button" onclick="sendPrivateMessage()">➤</button>
</div>
</div>

</div>
</div>

<div id="profileScreen" class="screen">
<div class="profile">
<div class="profile-head">

<div id="profileAvatar" class="profile-big-avatar">⚔️</div>
<div id="profileName" class="profile-name"></div>
<div id="profileUsername" class="profile-username">@arena</div>
<div id="profileBio" class="profile-bio"></div>

<div class="profile-stats">
<div class="stat"><span id="myDuelsCount" class="stat-number">0</span><span id="myDuelsLabel" class="stat-label"></span></div>
<div class="stat"><span id="myFollowersCount" class="stat-number">0</span><span id="myFollowersLabel" class="stat-label"></span></div>
<div class="stat"><span id="myFollowingCount" class="stat-number">0</span><span id="myFollowingLabel" class="stat-label"></span></div>
</div>

<div class="profile-buttons">
<button id="editProfileButton" type="button" onclick="openEditProfile()"></button>
<button id="logoutButton" type="button" onclick="logout()"></button>
<button id="adminButton" class="admin-button hidden" type="button" onclick="openAdminPanel()"></button>
</div>

<div id="adminPanel" class="admin-panel hidden">
<h3 id="adminTitle"></h3>
<br>
<div id="adminContent"></div>
</div>

</div>

<h3 id="myDuelsTitle" style="margin:18px 0 10px"></h3>
<div id="myDuels"></div>

</div>
</div>

<div id="otherProfileScreen" class="screen">
<div class="profile">
<div class="profile-head">

<div id="otherAvatar" class="profile-big-avatar">⚔️</div>
<div id="otherName" class="profile-name"></div>
<div id="otherUsername" class="profile-username">@arena</div>
<div id="otherBio" class="profile-bio"></div>

<div class="profile-stats">
<div class="stat"><span id="otherDuelsCount" class="stat-number">0</span><span class="stat-label">⚔️</span></div>
<div class="stat"><span id="otherFollowersCount" class="stat-number">0</span><span id="otherFollowersLabel" class="stat-label"></span></div>
<div class="stat"><span id="otherFollowingCount" class="stat-number">0</span><span id="otherFollowingLabel" class="stat-label"></span></div>
</div>

<div class="profile-buttons">
<button id="otherMessageButton" class="message-button" type="button" onclick="messageCurrentOtherUser()"></button>
<button id="otherFollowButton" class="follow-button" type="button"></button>
<button id="otherBackButton" type="button" onclick="showScreen('homeScreen')"></button>
</div>

</div>

<h3 id="otherDuelsTitle" style="margin:18px 0 10px"></h3>
<div id="otherDuels"></div>

</div>
</div>

<nav>
<button type="button" onclick="showScreen('homeScreen')">⚔️<br><span data-nav="arena"></span></button>
<button type="button" onclick="showScreen('searchScreen')">🔍<br><span data-nav="search"></span></button>
<button class="add" type="button" onclick="openDuelModal()">＋</button>
<button type="button" onclick="openChat()">💬<span id="chatUnreadBadge" class="nav-unread">0</span><br><span data-nav="chat"></span></button>
<button type="button" onclick="showProfile()">👤<br><span data-nav="profile"></span></button>
</nav>

</div>

<div id="duelModal" class="modal">
<div class="modal-box">

<h2 id="duelModalTitle"></h2>

<input id="duelTitle">

<select id="duelCategory">
<option value="Фильмы">🎬 Фильмы</option>
<option value="Музыка">🎵 Музыка</option>
<option value="Игры">🎮 Игры</option>
<option value="Спорт">⚽ Спорт</option>
<option value="Мемы">😂 Мемы</option>
<option value="Авто">🚗 Авто</option>
<option value="Другое">✨ Другое</option>
</select>

<select id="duelType" onchange="toggleDuelType()">
<option value="photo">🖼️ Фото-батл</option>
<option value="video">🎥 Видео-батл</option>
</select>

<select id="duelDuration">
<option value="24">⏱️ 24 часа</option>
<option value="48" selected>⏱️ 48 часов</option>
<option value="72">⏱️ 72 часа</option>
</select>

<div id="photoFields">

<input id="duelOptionA">

<label class="photo-button">
<span id="photoAText"></span>
<input id="duelImageA" type="file" accept="image/*" onchange="previewDuelMedia('A',event,'image')">
</label>

<div id="previewA" class="image-preview">
<img id="previewAImage">
</div>

<input id="duelOptionB">

<label class="photo-button">
<span id="photoBText"></span>
<input id="duelImageB" type="file" accept="image/*" onchange="previewDuelMedia('B',event,'image')">
</label>

<div id="previewB" class="image-preview">
<img id="previewBImage">
</div>

</div>

<div id="videoFields" class="hidden">

<input id="duelVideoOptionA">

<label class="photo-button">
🎥 Видео участника A
<input id="duelVideoA" type="file" accept="video/*" onchange="previewDuelMedia('A',event,'video')">
</label>

<div id="previewVideoA" class="image-preview">
<video id="previewVideoAElement" controls playsinline></video>
</div>

<input id="duelVideoOptionB">

<label class="photo-button">
🎥 Видео участника B
<input id="duelVideoB" type="file" accept="video/*" onchange="previewDuelMedia('B',event,'video')">
</label>

<div id="previewVideoB" class="image-preview">
<video id="previewVideoBElement" controls playsinline></video>
</div>

<div class="media-help">🎥 Максимальный размер видео — 100 MB.</div>

</div>

<button id="duelSubmitButton" class="primary" type="button" onclick="createDuel()"></button>
<button id="duelCancelButton" class="secondary" type="button" onclick="closeModal('duelModal')"></button>

<div id="duelStatus" class="status"></div>

</div>
</div>

<div id="editModal" class="modal">
<div class="modal-box">

<h2 id="editProfileTitle"></h2>

<label class="photo-button">
<span id="avatarText"></span>
<input id="avatarInput" type="file" accept="image/*" onchange="previewAvatar(event)">
</label>

<div id="avatarPreview" class="image-preview">
<img id="avatarPreviewImage">
</div>

<input id="editName">
<input id="editUsername">
<textarea id="editBio"></textarea>

<button id="saveProfileButton" class="primary" type="button" onclick="saveProfile()"></button>
<button id="editCancelButton" class="secondary" type="button" onclick="closeModal('editModal')"></button>

<div id="profileStatus" class="status"></div>

</div>
</div>

<div id="newMessageModal" class="modal">
<div class="modal-box">

<h2 id="newMessageTitle"></h2>
<input id="messageUserSearch">
<div id="messageUserResults"></div>
<button id="messageCancelButton" class="secondary" type="button" onclick="closeModal('newMessageModal')"></button>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</body>
</html>
