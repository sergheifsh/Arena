<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARENA — Who Beats Who</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#eef5ff}
body{font-family:Arial,sans-serif;color:#172033}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

#startupScreen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#eef5ff}
.startup-box{width:min(650px,100%);height:100vh;display:flex;align-items:center;justify-content:center;background:#fff}
.startup-logo,.logo{color:#2563eb;font-weight:900;text-align:center}
.startup-logo{font-size:27px}
.startup-logo small,.logo small{display:block;color:#64748b;letter-spacing:2px;font-size:9px}
.startup-loader{width:28px;height:28px;margin:18px auto;border:3px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#startupScreen.hide{opacity:0;visibility:hidden;pointer-events:none;transition:.2s}

.app{max-width:650px;margin:auto;min-height:100vh;background:#fff;padding-bottom:90px;box-shadow:0 0 25px #1e40af1a}

header{position:sticky;top:0;z-index:20;height:62px;background:#fff;border-bottom:1px solid #dbe4f0;padding:8px 12px}
.top-row{height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.logo{font-size:21px}
.language{position:absolute;right:2px;border:1px solid #cbd5e1;background:#f8fafc;border-radius:8px;padding:5px 6px;font-size:10px}

.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#dbeafe,#eff6ff,#fff)}
.auth-box{width:min(430px,100%);background:#fff;padding:25px;border-radius:22px;box-shadow:0 10px 35px #2563eb26;border:1px solid #dbeafe}
.auth-box h1{text-align:center;color:#2563eb;margin-bottom:6px}
.auth-subtitle{text-align:center;color:#64748b;font-size:13px;margin-bottom:18px}
.auth-box input,.search-box input,.modal-box input,.modal-box textarea,.modal-box select{width:100%;padding:13px;margin:6px 0;border:1px solid #cbd5e1;border-radius:11px;outline:0}
.auth-box input:focus,.search-box input:focus,.modal-box input:focus,.modal-box textarea:focus{border-color:#2563eb}
.auth-box button:not(.password-toggle),.primary{width:100%;padding:13px;margin-top:8px;border:0;border-radius:11px;background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;font-weight:bold}
.auth-switch{text-align:center;margin-top:13px;color:#2563eb;cursor:pointer}
.password-box{position:relative}
.password-box input{padding-right:55px!important}
.password-toggle{position:absolute!important;right:5px;top:5px;width:45px!important;height:42px;padding:5px!important;margin:0!important;background:transparent!important;color:#2563eb!important;border:0}
.status{text-align:center;padding:12px;color:#2563eb}

.screen{display:none}
.screen.active{display:block}

.arena-top{text-align:center;padding:20px 15px 10px}
.arena-title{font-size:30px;font-weight:900}
.arena-subtitle{margin-top:6px;color:#64748b;font-size:14px}

.categories{display:flex;gap:7px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
.category-btn,.top-tab{flex-shrink:0;border:1px solid #dbe4f0;background:#f8fafc;color:#475569;padding:8px 13px;border-radius:20px;font-size:12px;font-weight:bold}
.category-btn.active,.top-tab.active{background:#2563eb;border-color:#2563eb;color:#fff}

.create-duel{margin:14px;border-radius:17px;background:linear-gradient(135deg,#eff6ff,#f8fafc);border:1px solid #bfdbfe;padding:15px}
.create-duel button{width:100%;border:0;background:0;color:#2563eb;font-weight:bold;padding:8px;font-size:15px}

.duel{margin:10px 12px 18px;border:1px solid #dbe4f0;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 5px 18px #0f172a12}
.duel-head{padding:13px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.duel-category{background:#eff6ff;color:#2563eb;padding:6px 9px;border-radius:10px;font-size:11px;font-weight:bold}
.duel-time{color:#94a3b8;font-size:11px}
.delete-btn{background:#fee2e2;color:#dc2626;border:0;padding:4px 8px;border-radius:8px;font-size:11px;font-weight:bold}
.duel-title{padding:0 14px 13px;font-size:18px;font-weight:bold}

.duel-options{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 8px 8px}
.option{border:2px solid #e2e8f0;border-radius:15px;overflow:hidden;background:#f8fafc;display:flex;flex-direction:column}
.option-media{height:205px;background:#e2e8f0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.option-media img,.option-media video{width:100%;height:100%;object-fit:cover}
.option-placeholder{font-size:38px;color:#64748b}
.option-label{padding:10px 7px;text-align:center;font-weight:bold;font-size:14px;word-break:break-word}
.vote-button{width:calc(100% - 16px);margin:0 8px 8px;border:0;border-radius:12px;padding:12px;background:#2563eb;color:#fff;font-weight:bold}
.vote-button.voted{background:#10b981}
.vote-stats{padding:0 8px 10px;text-align:center;font-size:12px;color:#64748b;font-weight:bold}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:43px;height:43px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#172033;color:#fff;font-size:13px;font-weight:900;box-shadow:0 4px 15px #0003}

.section-title{padding:20px 15px 8px;font-size:23px;font-weight:900}
.top-tabs{display:flex;gap:7px;padding:8px 14px}
.top-tab{flex:1;border-radius:10px;padding:9px;text-align:center}

.profile{padding:15px}
.profile-head{text-align:center;padding:15px 5px 20px;border-bottom:1px solid #dbe4f0}
.profile-big-avatar{width:90px;height:90px;margin:auto;border-radius:50%;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:45px;overflow:hidden;border:3px solid #3b82f6}
.profile-name{font-size:22px;font-weight:bold;margin-top:10px}
.profile-username{color:#64748b;margin-top:3px}
.profile-bio{margin:8px 0;color:#475569;white-space:pre-wrap}
.profile-stats{display:flex;justify-content:center;gap:35px;margin:18px 0}
.stat{text-align:center}
.stat-number{display:block;font-size:19px;font-weight:bold;color:#2563eb}
.stat-label{font-size:12px;color:#64748b}
.profile-buttons{display:flex;gap:8px;flex-wrap:wrap}
.profile-buttons button{flex:1;min-width:120px;border:0;border-radius:10px;padding:11px;background:#eff6ff;color:#1d4ed8}
.admin-button{width:100%!important;flex-basis:100%;background:#172033!important;color:#fff!important}

.admin-panel{margin-top:15px;padding:15px;border:1px solid #bfdbfe;border-radius:15px;background:#eff6ff;text-align:left}
.user-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #dbe4f0}

/* Чаты */
.chat-container{display:flex;flex-direction:column;height:calc(100vh - 130px);padding:10px}
.chat-messages{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;background:#f8fafc;border-radius:12px;border:1px solid #e2e8f0}
.message-bubble{max-width:75%;padding:10px 14px;border-radius:14px;font-size:14px;word-break:break-word}
.message-bubble.my{background:#2563eb;color:#fff;align-self:flex-end;border-bottom-right-radius:2px}
.message-bubble.other{background:#fff;color:#172033;align-self:flex-start;border-bottom-left-radius:2px;border:1px solid #cbd5e1}
.chat-input-area{display:flex;gap:8px;margin-top:10px}
.chat-input-area input{flex:1;padding:11px;border:1px solid #cbd5e1;border-radius:11px;outline:0}

nav{position:fixed;bottom:env(safe-area-inset-bottom, 15px);left:50%;transform:translateX(-50%);width:min(630px,95%);height:56px;background:#fff;border:1px solid #dbe4f0;border-radius:16px;display:flex;align-items:center;justify-content:space-around;z-index:50;box-shadow:0 4px 15px #0f172a15}
nav button{position:relative;flex:1;height:100%;border:0;background:transparent;color:#64748b;font-size:14px}
nav button span{font-size:9px}
nav button.add{flex:0 0 46px;width:46px;height:46px;margin-top:-18px;border-radius:50%;background:#2563eb;color:#fff;font-size:24px;box-shadow:0 4px 12px #2563eb55}
.nav-unread{position:absolute;top:3px;right:25%;min-width:16px;height:16px;padding:0 4px;border-radius:20px;background:#dc2626;color:#fff;font-size:8px!important;display:none;align-items:center;justify-content:center}

.modal{display:none;position:fixed;inset:0;background:#0f172a99;z-index:100;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal-box{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px}
.modal-box h2{margin-bottom:12px;color:#2563eb}
.modal-box textarea{resize:vertical;min-height:90px}
.photo-button{display:block;padding:13px;margin:6px 0;border:2px dashed #60a5fa;border-radius:12px;text-align:center;color:#2563eb;font-weight:bold;background:#eff6ff}
#duelImageA,#duelImageB,#duelVideoA,#duelVideoB,#avatarInput{display:none}
.image-preview{display:block;width:100%;height:170px;margin:7px 0;border-radius:12px;overflow:hidden;background:#e2e8f0}
.image-preview img,.image-preview video{width:100%;height:100%;object-fit:cover}
.secondary{width:100%;padding:12px;margin-top:8px;border:0;border-radius:12px;background:#f1f5f9;color:#334155}
.empty{text-align:center;padding:35px 15px;color:#64748b}
</style>
</head>

<body>

<div id="startupScreen">
<div class="startup-box">
<div>
<div class="startup-logo">⚔️ ARENA<small>WHO BEATS WHO?</small></div>
<div class="startup-loader"></div>
</div>
</div>
</div>

<div id="auth" class="auth">
<div class="auth-box">
<h1>⚔️ ARENA</h1>
<div id="authSubtitle" class="auth-subtitle"></div>

<div id="loginBox">
<input id="loginEmail" type="email" autocomplete="email" placeholder="Email">
<div class="password-box">

</div>

<div id="registerBox" class="hidden">
<input id="regName" autocomplete="name" placeholder="Имя">
<input id="regEmail" type="email" autocomplete="email" placeholder="Email">
<div class="password-box">
<input id="regPassword" type="password" autocomplete="new-password" placeholder="Пароль">
<button type="button" class="password-toggle" onclick="togglePassword('regPassword',this)">👁️</button>
</div>
<button id="registerButton" type="button" onclick="register()"></button>
<div id="loginSwitch" class="auth-switch" onclick="showLogin()"></div>
</div>

<div id="authStatus" class="status"></div>
</div>
</div>

<div id="app" class="app hidden">

<header>
<div class="top-row">
<div class="logo">⚔️ ARENA<small>WHO BEATS WHO?</small></div>
<select id="languageSelect" class="language" onchange="changeLanguage(this.value)">
<option value="ru">🇷🇺 RU</option>

<option value="en">🇬🇧 EN</option>
</select>
</div>
</header>

<div id="homeScreen" class="screen active">

</div>

<div class="categories">
<button class="category-btn active" data-category="all" onclick="selectCategory('all',this)">Все</button>
<button class="category-btn" data-category="Фильмы" onclick="selectCategory('Фильмы',this)">Фильмы</button>
<button class="category-btn" data-category="Музыка" onclick="selectCategory('Музыка',this)">Музыка</button>
<button class="category-btn" data-category="Игры" onclick="selectCategory('Игры',this)">Игры</button>
<button class="category-btn" data-category="Спорт" onclick="selectCategory('Спорт',this)">Спорт</button>

<button class="category-btn" data-category="Другое" onclick="selectCategory('Другое',this)">Другое</button>
</div>

<div class="create-duel">
<button onclick="openDuelModal()" id="createDuelButton"></button>
</div>

<div id="duelsFeed">

<div id="adminPanel" class="admin-panel hidden">

</div>
</div>
</div>

<nav>

<button type="button" onclick="showScreen('chatScreen')">💬<br><span>Чат</span></button>

</div>

<option value="Фильмы">🎬 Фильмы</option>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
"use strict";

const SUPABASE_URL = "https://wwlhsveslabnackqlgxd.supabase.co";
const SUPABASE_KEY = "sb_publishable_W8XoOG8et8j2-CVHk9OKcA_Bd-uhI8b";

let db = null;
let currentUser = null;
let currentProfile = null;
let currentCategory = "all";
let language = localStorage.getItem("arena_language") || "ru";

let mediaFiles = { imageA: null, imageB: null, videoA: null, videoB: null, avatar: null };

const translations = {
  ru: { arenaTitle: "⚔️ Батлы на Арене", arenaSubtitle: "Голосуй за лучших, создавай свои батлы", createDuel: "➕ Создать новый батл", authSubtitle: "Войдите или зарегистрируйтесь", loginBtn: "Войти", registerBtn: "Создать аккаунт", toRegister: "Нет аккаунта? Зарегистрироваться", toLogin: "Уже есть аккаунт? Войти" },
  ro: { arenaTitle: "⚔️ Bătălii în Arenă", arenaSubtitle: "Votează cei mai buni", createDuel: "➕ Creează o bătălie", authSubtitle: "Autentifică-te sau înregistrează-te", loginBtn: "Autentificare", registerBtn: "Înregistrare", toRegister: "Nu ai cont? Înregistrează-te", toLogin: "Ai deja cont? Autentifică-te" },
  en: { arenaTitle: "⚔️ Arena Battles", arenaSubtitle: "Vote for the best", createDuel: "Create New Battle", authSubtitle: "Sign in or register", loginBtn: "Sign In", registerBtn: "Register", toRegister: "No account? Register", toLogin: "Already have an account? Sign In" }
};

const $ = id => document.getElementById(id);

function applyLanguage() {
  const t = translations[language] || translations.ru;
  if ($("arenaTitle")) $("arenaTitle").textContent = t.arenaTitle;
  if ($("arenaSubtitle")) $("arenaSubtitle").textContent = t.arenaSubtitle;
  if ($("createDuelButton")) $("createDuelButton").textContent = t.createDuel;
  if ($("authSubtitle")) $("authSubtitle").textContent = t.authSubtitle;
  if ($("loginButton")) $("loginButton").textContent = t.loginBtn;
  if ($("registerButton")) $("registerButton").textContent = t.registerBtn;
  if ($("registerSwitch")) $("registerSwitch").textContent = t.toRegister;
  if ($("loginSwitch")) $("loginSwitch").textContent = t.toLogin;
}

function changeLanguage(lang) {
  language = lang;
  localStorage.setItem("arena_language", lang);
  applyLanguage();
}

function togglePassword(id, btn) {
  const input = $(id);
  if (input.type === "password") { input.type = "text"; btn.textContent = "🙈"; }
  else { input.type = "password"; btn.textContent = "👁️"; }
}

function showRegister() { $("loginBox").classList.add("hidden"); $("registerBox").classList.remove("hidden"); $("authStatus").textContent = ""; }
function showLogin() { $("registerBox").classList.add("hidden"); $("loginBox").classList.remove("hidden"); $("authStatus").textContent = ""; }

function showScreen(screenId) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  const target = $(screenId);
  if (target) target.classList.add("active");
  window.scrollTo(0, 0);
  if (screenId === "chatScreen") loadGlobalChat();
}

function closeModal(modalId) { $(modalId).classList.remove("show"); }
function openModal(modalId) { $(modalId).classList.add("show"); }

async function initApp() {
  try {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    applyLanguage();

    const { data: { session } } = await db.auth.getSession();
    if (session && session.user) {
      currentUser = session.user;
      await loadProfile();
      $("auth").style.display = "none";
      $("app").classList.remove("hidden");
      loadDuels();
    } else {
      $("auth").style.display = "flex";
    }
  } catch (err) {
    console.error("Init error:", err);
  } finally {
    $("startupScreen").classList.add("hide");
    setTimeout(() => $("startupScreen").remove(), 250);
  }
}

async function login() {
  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;
  if (!email || !password) return;

  $("authStatus").textContent = "Вход...";
  const { data, error } = await db.auth.signInWithPassword({ email, password });
  if (error) {
    $("authStatus").textContent = error.message;
  } else {
    currentUser = data.user;
    await loadProfile();
    $("auth").style.display = "none";
    $("app").classList.remove("hidden");
    loadDuels();
  }
}

async function register() {
  const name = $("regName").value.trim();
  const email = $("regEmail").value.trim();
  const password = $("regPassword").value;
  if (!name || !email || !password) return;

  $("authStatus").textContent = "Регистрация...";
  const { data, error } = await db.auth.signUp({ email, password, options: { data: { name } } });
  if (error) {
    $("authStatus").textContent = error.message;
  } else {
    currentUser = data.user;
    await loadProfile();
    $("auth").style.display = "none";
    $("app").classList.remove("hidden");
    loadDuels();
  }
}

async function logout() {
  await db.auth.signOut();
  currentUser = null;
  currentProfile = null;
  $("app").classList.add("hidden");
  $("auth").style.display = "flex";
}

async function loadProfile() {
  if (!currentUser) return;
  const { data } = await db.from("profiles").select("*").eq("id", currentUser.id).single();
  if (data) {
    currentProfile = data;
    if ($("profileName")) $("profileName").textContent = data.name || "User";
    if ($("profileUsername")) $("profileUsername").textContent = "@" + (data.username || "arena");
    if ($("profileBio")) $("profileBio").textContent = data.bio || "";
    if (data.is_admin && $("adminButton")) {
      $("adminButton").classList.remove("hidden");
      loadAdminPanelUsers();
    }
  }
}

function selectCategory(cat, btn) {
  currentCategory = cat;
  document.querySelectorAll(".category-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  loadDuels();
}

async function loadDuels() {
  const container = $("duelsFeed");
  if (!container) return;
  container.innerHTML = `<div class="status">Загрузка батлов...</div>`;

  let query = db.from("duels").select("*").order("created_at", { ascending: false });
  if (currentCategory !== "all") query = query.eq("category", currentCategory);

  const { data, error } = await query;
  if (error || !data || data.length === 0) {
    container.innerHTML = `<div class="empty">Батлов пока нет</div>`;
    return;
  }

  container.innerHTML = data.map(duel => {
    let mediaA = `<div class="option-placeholder">🖼️</div>`;
    let mediaB = `<div class="option-placeholder">🖼️</div>`;
    
    if (duel.media_type === "video") {
      if (duel.image_a) mediaA = `<video src="${duel.image_a}" controls playsinline></video>`;
      if (duel.image_b) mediaB = `<video src="${duel.image_b}" controls playsinline></video>`;
    } else {
      if (duel.image_a) mediaA = `<img src="${duel.image_a}" alt="A">`;
      if (duel.image_b) mediaB = `<img src="${duel.image_b}" alt="B">`;
    }

    const votesA = duel.votes_a || 0;
    const votesB = duel.votes_b || 0;
    const totalVotes = votesA + votesB;
    const percentA = totalVotes > 0 ? Math.round((votesA / totalVotes) * 100) : 0;
    const percentB = totalVotes > 0 ? Math.round((votesB / totalVotes) * 100) : 0;

    const canDelete = currentProfile?.is_admin || duel.user_id === currentUser.id;

    return `
      <div class="duel" id="duel-${duel.id}">
        <div class="duel-head">
          <span class="duel-category">${duel.category}</span>
          <div style="display:flex;gap:8px;align-items:center">
            <span class="duel-time">⏳ до ${new Date(new Date(duel.created_at).getTime() + (duel.duration_hours || 24)*3600000).toLocaleString([], {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})}</span>
            ${canDelete ? `<button class="delete-btn" onclick="deleteDuel('${duel.id}')">Удалить</button>` : ''}
          </div>
        </div>
        <div class="duel-title">${duel.title}</div>
        <div class="duel-options">
          <div class="option">
            <div class="option-media">${mediaA}</div>
            <div class="option-label">${duel.option_a}</div>
            <div class="vote-stats">${votesA} голос. (${percentA}%)</div>
            <button class="vote-button" onclick="voteDuel('${duel.id}', 'A')">Голос за A</button>
          </div>
          <div class="vs">VS</div>
          <div class="option">
            <div class="option-media">${mediaB}</div>
            <div class="option-label">${duel.option_b}</div>
            <div class="vote-stats">${votesB} голос. (${percentB}%)</div>
            <button class="vote-button" onclick="voteDuel('${duel.id}', 'B')">Голос за B</button>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

async function voteDuel(duelId, option) {
  const { data: duel, error } = await db.from("duels").select("*").eq("id", duelId).single();
  if (error || !duel) return;

  const updateData = option === 'A' ? { votes_a: (duel.votes_a || 0) + 1 } : { votes_b: (duel.votes_b || 0) + 1 };
  
  const { error: updateError } = await db.from("duels").update(updateData).eq("id", duelId);
  if (!updateError) {
    loadDuels();
  }
}

async function deleteDuel(duelId) {
  if (!confirm("Удалить этот батл?")) return;
  const { error } = await db.from("duels").delete().eq("id", duelId);
  if (!error) loadDuels();
}

function openDuelModal() { openModal("duelModal"); }

function toggleDuelType() {
  const type = $("duelType").value;
  if (type === "video") {
    $("photoFields").classList.add("hidden");
    $("videoFields").classList.remove("hidden");
  } else {
    $("videoFields").classList.add("hidden");
    $("photoFields").classList.remove("hidden");
  }
}

function previewDuelMedia(target, event) {
  const file = event.target.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);
  if (target === 'A') {
    mediaFiles.imageA = file;
    const p = $("previewA");
    p.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover">`;
    p.classList.remove("hidden");
  } else if (target === 'B') {
    mediaFiles.imageB = file;
    const p = $("previewB");
    p.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover">`;
    p.classList.remove("hidden");
  } else if (target === 'videoA') {
    mediaFiles.videoA = file;
    const p = $("previewVideoA");
    p.innerHTML = `<video src="${url}" style="width:100%;height:100%;object-fit:cover" controls></video>`;
    p.classList.remove("hidden");
  } else if (target === 'videoB') {
    mediaFiles.videoB = file;
    const p = $("previewVideoB");
    p.innerHTML = `<video src="${url}" style="width:100%;height:100%;object-fit:cover" controls></video>`;
    p.classList.remove("hidden");
  }
}

function previewAvatar(event) {
  const file = event.target.files[0];
  if (!file) return;
  mediaFiles.avatar = file;
  const url = URL.createObjectURL(file);
  const p = $("previewAvatarContainer");
  p.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover">`;
  p.classList.remove("hidden");
}

async function uploadFileToSupabase(file, folder) {
  if (!file) return null;
  const fileName = `${currentUser.id}_${Date.now()}_${file.name}`;
  const { error } = await db.storage.from("arena-media").upload(`${folder}/${fileName}`, file);
  if (error) {
    console.error("Upload error:", error);
    return null;
  }
  const { data: publicUrlData } = db.storage.from("arena-media").getPublicUrl(`${folder}/${fileName}`);
  return publicUrlData.publicUrl;
}

async function createDuel() {
  const title = $("duelTitle").value.trim();
  const category = $("duelCategory").value;
  const type = $("duelType").value;
  const duration = parseInt($("duelDuration").value);
  
  let optionA = "";
  let optionB = "";
  let fileA = null;
  let fileB = null;

  if (type === "video") {
    optionA = $("duelVideoOptionA").value.trim();
    optionB = $("duelVideoOptionB").value.trim();
    fileA = mediaFiles.videoA;
    fileB = mediaFiles.videoB;
  } else {
    optionA = $("duelOptionA").value.trim();
    optionB = $("duelOptionB").value.trim();
    fileA = mediaFiles.imageA;
    fileB = mediaFiles.imageB;
  }

  if (!title || !optionA || !optionB) {
    $("duelStatus").textContent = "Заполните все текстовые поля!";
    return;
  }

  if (!fileA || !fileB) {
    $("duelStatus").textContent = "Выберите оба файла!";
    return;
  }

  $("duelStatus").textContent = "Загрузка медиа...";

  let urlA = await uploadFileToSupabase(fileA, "duels");
  let urlB = await uploadFileToSupabase(fileB, "duels");

  if (!urlA || !urlB) {
    $("duelStatus").textContent = "Ошибка загрузки файлов.";
    return;
  }

  $("duelStatus").textContent = "Публикация...";

  const { error } = await db.from("duels").insert({
    title, 
    category, 
    option_a: optionA, 
    option_b: optionB,
    image_a: urlA,
    image_b: urlB,
    media_type: type,
    duration_hours: duration,
    user_id: currentUser.id, 
    votes_a: 0, 
    votes_b: 0
  });

  if (error) {
    $("duelStatus").textContent = error.message;
  } else {
    closeModal("duelModal");
    $("duelStatus").textContent = "";
    $("duelTitle").value = "";
    $("duelOptionA").value = "";
    $("duelOptionB").value = "";
    $("duelVideoOptionA").value = "";
    $("duelVideoOptionB").value = "";
    mediaFiles = { imageA: null, imageB: null, videoA: null, videoB: null, avatar: null };
    $("previewA").classList.add("hidden");
    $("previewB").classList.add("hidden");
    $("previewVideoA").classList.add("hidden");
    $("previewVideoB").classList.add("hidden");
    loadDuels();
  }
}

/* Общий чат */
async function loadGlobalChat() {
  const container = $("globalChatMessages");
  if (!container) return;
  
  const { data, error } = await db.from("messages").select("*, profiles(name)").order("created_at", { ascending: true }).limit(50);
  if (error || !data) {
    container.innerHTML = `<div class="empty">Нет сообщений</div>`;
    return;
  }

  container.innerHTML = data.map(msg => {
    const isMy = msg.user_id === currentUser.id;
    const name = msg.profiles?.name || "Участник";
    return `
      <div class="message-bubble ${isMy ? 'my' : 'other'}">
        <div style="font-size:10px;font-weight:bold;margin-bottom:2px;opacity:0.8">${isMy ? 'Вы' : name}</div>
        <div>${msg.text}</div>
      </div>
    `;
  }).join("");
  container.scrollTop = container.scrollHeight;
}

async function sendGlobalMessage() {
  const input = $("globalChatInput");
  const text = input.value.trim();
  if (!text) return;

  const { error } = await db.from("messages").insert({
    text,
    user_id: currentUser.id
  });

  if (!error) {
    input.value = "";
    loadGlobalChat();
  }
}

/* Админ-панель */
async function loadAdminPanelUsers() {
  const container = $("adminUsersList");
  if (!container) return;

  const { data, error } = await db.from("profiles").select("*").order("name");
  if (error || !data) return;

  container.innerHTML = data.map(u => `
    <div class="user-row">
      <div>
        <strong>${u.name || "Без имени"}</strong> <span style="color:#64748b">(@${u.username || 'arena'})</span>
      </div>
      ${u.id !== currentUser.id ? `<button class="delete-btn" onclick="deleteUser('${u.id}')">Удалить участника</button>` : '<span style="font-size:11px;color:#2563eb">Вы</span>'}
    </div>
  `).join("");
}

async function deleteUser(userId) {
  if (!confirm("Удалить этого участника и все его данные?")) return;
  // Сначала удаляем его батлы
  await db.from("duels").delete().eq("user_id", userId);
  // Затем профиль
  const { error } = await db.from("profiles").delete().eq("id", userId);
  if (!error) {
    loadAdminPanelUsers();
    loadDuels();
  }
}

function showProfile() { showScreen("profileScreen"); }
function openEditProfile() {
  openModal("editModal");
  if (currentProfile) {
    $("editName").value = currentProfile.name || "";
    $("editUsername").value = currentProfile.username || "";
    $("editBio").value = currentProfile.bio || "";
  }
}

async function saveProfile() {
  const name = $("editName").value.trim();
  const username = $("editUsername").value.trim();
  const bio = $("editBio").value.trim();

  $("profileStatus").textContent = "Сохранение...";
  let avatarUrl = null;
  if (mediaFiles.avatar) {
    avatarUrl = await uploadFileToSupabase(mediaFiles.avatar, "avatars");
  }

  let updateData = { name, username, bio };
  if (avatarUrl) updateData.avatar_url = avatarUrl;

  const { error } = await db.from("profiles").update(updateData).eq("id", currentUser.id);

  if (error) {
    $("profileStatus").textContent = error.message;
  } else {
    closeModal("editModal");
    $("profileStatus").textContent = "";
    await loadProfile();
  }
}

function openAdminPanel() { $("adminPanel").classList.toggle("hidden"); }

window.addEventListener("DOMContentLoaded", initApp);
</script>
