function setLang(lang) {
  const safeLang = ["ru", "ro", "en"].includes(lang) ? lang : "ru";
  localStorage.setItem("arena_language", safeLang);
  document.documentElement.lang = safeLang;
  document.getElementById("policyContent").innerHTML = POLICY_TEXT[safeLang];
  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.lang === safeLang);
  });
}

document.addEventListener("DOMContentLoaded", () => {
  const saved = localStorage.getItem("arena_language") || "ru";
  setLang(saved);
});
